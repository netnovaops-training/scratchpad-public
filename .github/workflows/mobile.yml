# Android (Kotlin, detekt) and Apple (Swift, SwiftLint) checks, like garden-for-all's detekt.yml and
# sprout-pals' iOS checks. The Scratchpad holds no Kotlin or Swift yet (2026-11-17): each job looks first
# and writes an empty findings list when there is nothing to scan, so the workflow is ready the day app code
# lands here. Results: findings-detekt / findings-swiftlint artifacts (14 days), pulled by the NUC's
# github_pull.py, same as rust.yml. Findings never turn the run red; a broken tool or bad checksum does.
# Both tools run on Linux (SwiftLint has a Linux build), so no macOS minutes are spent.
# Added 2026-11-17. Public copy: findings also go to the Security tab (Code scanning), like garden-for-all.
name: mobile

on:
  push:
    branches: [main]
    paths: ['**/*.kt', '**/*.kts', '**/*.swift', '.github/workflows/mobile.yml', 'tools/ci/findings.py']
  pull_request:
    branches: [main]
    paths: ['**/*.kt', '**/*.kts', '**/*.swift']
  schedule:
    - cron: '43 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  DETEKT_VERSION: "1.23.8"
  DETEKT_SHA256: "3afe89a11120303c73c9bdda3d8fe558dd9070a6937d27819ddc04b275381245" # same as garden-for-all
  SWIFTLINT_VERSION: "0.65.1"
  SWIFTLINT_SHA256: "caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d" # GitHub release digest

jobs:
  detekt:
    name: Android (detekt)
    permissions:
      contents: read
      security-events: write # uploads the SARIF file
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Any Kotlin here?
        id: look
        run: echo "n=$(git ls-files '*.kt' '*.kts' | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.look.outputs.n != '0'
        with:
          distribution: temurin
          java-version: "17"
      - name: detekt (finds things, does not fail on them)
        if: steps.look.outputs.n != '0'
        run: |
          curl --fail --silent --show-error --location --retry 3 --output detekt-cli.jar \
            "https://repo1.maven.org/maven2/io/gitlab/arturbosch/detekt/detekt-cli/${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
          echo "${DETEKT_SHA256}  detekt-cli.jar" | sha256sum --check --strict -
          rc=0
          # pc/apps/detekt.yml (2026-11-19): MagicNumber ignores for themes, HTTP codes, timeouts, Compose UI.
          # Same as the private Scratchpad mobile.yml; public_copy.py does not copy .github, so set here too.
          cfg=()
          [ -f pc/apps/detekt.yml ] && cfg=(--config pc/apps/detekt.yml)
          java -jar detekt-cli.jar --input . --build-upon-default-config "${cfg[@]}" --report sarif:detekt.sarif || rc=$?
          echo "detekt exit code: $rc (2 = findings, which is fine here)"
          [ "$rc" = 0 ] || [ "$rc" = 2 ] || exit 1
      - name: Send the findings to the Security tab (category detekt)
        if: hashFiles('detekt.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: detekt.sarif
          category: detekt
      - name: Findings file
        run: python3 tools/ci/findings.py sarif detekt.sarif --tool detekt --out findings-detekt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-detekt
          path: findings-detekt.json
          retention-days: 14

  swiftlint:
    name: Apple (SwiftLint)
    permissions:
      contents: read
      security-events: write # uploads the SARIF file
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Any Swift here?
        id: look
        run: echo "n=$(git ls-files '*.swift' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: SwiftLint (finds things, does not fail on them)
        if: steps.look.outputs.n != '0'
        run: |
          curl --fail --silent --show-error --location --retry 3 --output swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          echo "${SWIFTLINT_SHA256}  swiftlint.zip" | sha256sum --check --strict -
          unzip -q swiftlint.zip -d swiftlint-bin
          ./swiftlint-bin/swiftlint lint --reporter sarif --quiet > swiftlint.sarif || true
          python3 -c "import json; json.load(open('swiftlint.sarif'))" || { echo "::error title=swiftlint::no report"; exit 1; }
      - name: Send the findings to the Security tab (category swiftlint)
        if: hashFiles('swiftlint.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: swiftlint.sarif
          category: swiftlint
      - name: Findings file
        run: python3 tools/ci/findings.py sarif swiftlint.sarif --tool swiftlint --out findings-swiftlint.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings-swiftlint
          path: findings-swiftlint.json
          retention-days: 14
