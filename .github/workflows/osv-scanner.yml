# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up periodic OSV-Scanner scanning for vulnerabilities,
# in addition to a PR check which fails if new vulnerabilities are introduced.
#
# For more examples and options, including how to ignore specific vulnerabilities,
# see https://google.github.io/osv-scanner/github-action/

name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '29 23 * * 2'
  push:
    branches: [ "main" ]

permissions:
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Read commit contents
  contents: read
  # v2 reusable workflows ask for actions: read (SARIF upload status); a caller must grant it.
  actions: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    # v2.7.0 (same commit code-health pins). OUTCOME 2026-11-19: v1.7.1 uses upload-artifact v3, which
    # GitHub now refuses ("deprecated version of actions/upload-artifact"), so every PR scan failed in 3 s.
    # v2 dropped --skip-git (git roots are not scanned by default any more).
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932" # v2.7.1
    with:
      # 2026-11-19: the scheduled/push scan reports to the Security tab and no longer turns red on known
      # vulnerabilities (it failed every run on pc/ai-stack/rust/Cargo.lock). The PR scan below still fails
      # when a PR ADDS a vulnerable dependency.
      fail-on-vuln: false
      scan-args: |-
        -r
        ./
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932" # v2.7.1
    with:
      scan-args: |-
        -r
        ./
