# One Dependabot PR per repo per month: every ecosystem in one multi-ecosystem group,
# 00:00 New York on the 1st (before the 6 AM pull). Owner's rule 2026-11-19: few, large PRs.
# Made by Scratchpad tools/dependabot_one_pr.py; edit the ecosystem list here, keep the group.
version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "00:00"
      timezone: America/New_York
updates:
- package-ecosystem: pip
  directories:
  - /pc/ai-stack/colibri
  - /.github/requirements
  labels:
  - dependencies
  - python
  patterns:
  - '*'
  multi-ecosystem-group: all-dependencies
- package-ecosystem: cargo
  directory: /pc/ai-stack/rust
  labels:
  - dependencies
  - rust
  patterns:
  - '*'
  multi-ecosystem-group: all-dependencies
- package-ecosystem: docker
  directories:
  - /pc/ai-stack/collage
  - /pc/ai-stack/dj
  - /pc/ai-stack/hermes
  - /pc/ai-stack/metrics
  - /pc/ai-stack/n8n
  - /pc/ai-stack/peewee-tools/studio
  - /pc/ai-stack/pi-digits
  - /pc/ai-stack/printq
  - /pc/ai-stack/rust
  - /pc/ai-stack/stt
  - /pc/ai-stack/tables
  - /pc/ai-stack/telegram
  - /pc/ai-stack/telephony
  - /pc/ai-stack/voice
  - /pc/ai-stack/watchdog
  - /pc/ai-stack/web
  labels:
  - dependencies
  - docker
  patterns:
  - '*'
  multi-ecosystem-group: all-dependencies
- package-ecosystem: github-actions
  directory: /
  labels:
  - dependencies
  - github-actions
  patterns:
  - '*'
  multi-ecosystem-group: all-dependencies
