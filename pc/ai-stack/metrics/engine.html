<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine Bay</title>
<style>
  :root{--bg:#14110d;--panel:#1d1813;--brass:#9c7a3c;--amber:#e8a33d;
        --cream:#f3e9d7;--dim:#8a7a5c;--red:#c8452c;--teal:#5ec8c0;
        --teal-dim:#2e6e6a}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--cream);
       font-family:"Segoe UI",system-ui,sans-serif;padding:22px;min-height:100vh}
  h1{font-size:1.15rem;letter-spacing:.18em;text-transform:uppercase;
     color:var(--amber);text-align:center;margin-bottom:16px}
  .machine{max-width:1180px;margin:0 auto 26px;border:1px solid var(--brass);
           border-radius:16px;padding:14px 12px 10px;background:rgba(0,0,0,.12)}
  .machine.nuc{border-color:var(--teal-dim)}
  .mhead{display:flex;align-items:baseline;justify-content:center;gap:14px;
         margin-bottom:10px}
  .mname{font-size:1rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
  .machine.sn .mname{color:var(--amber)}
  .machine.nuc .mname{color:var(--teal)}
  .msub{color:var(--dim);font-size:.78rem;font-variant-numeric:tabular-nums}
  .row{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-bottom:12px}
  .dial{background:var(--panel);border:1px solid var(--brass);border-radius:14px;
        padding:10px 8px 6px;text-align:center}
  .machine.nuc .dial{border-color:var(--teal-dim)}
  canvas{display:block}
  .bars{max-width:760px;margin:0 auto}
  .bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.85rem}
  .bar .lab{width:170px;text-align:right;color:var(--dim)}
  .bar .track{flex:1;height:14px;background:#0d0b08;border:1px solid var(--brass);
              border-radius:7px;overflow:hidden}
  .machine.nuc .bar .track{border-color:var(--teal-dim)}
  .bar .fill{height:100%;width:0%;transition:width .8s}
  .machine.sn .bar .fill{background:linear-gradient(90deg,var(--amber),var(--red))}
  .machine.nuc .bar .fill{background:linear-gradient(90deg,var(--teal),var(--red))}
  .bar .val{width:150px;color:var(--cream);font-variant-numeric:tabular-nums}
  .stale{color:var(--red);text-align:center;margin:6px 0;display:none;font-size:.85rem}
</style>
</head>
<body>
<h1>Engine Bay</h1>

<div class="machine sn" id="m-supernova">
  <div class="mhead"><span class="mname">SuperNova</span><span class="msub" id="sub-supernova">&mdash;</span></div>
  <div class="row" id="dials-supernova"></div>
  <div class="bars" id="bars-supernova"></div>
  <p class="stale" id="stale-supernova">SuperNova's feed has gone quiet &mdash; these needles are old.</p>
</div>

<div class="machine nuc" id="m-nuc">
  <div class="mhead"><span class="mname">NUC</span><span class="msub" id="sub-nuc">&mdash;</span></div>
  <div class="row" id="dials-nuc"></div>
  <div class="bars" id="bars-nuc"></div>
  <p class="stale" id="stale-nuc">The NUC's feed has gone quiet &mdash; these needles are old.</p>
</div>

<script>
/* Tachometers, not line graphs -- Jason's word was "taco meter" and the
   needle knows what he meant. 2026-09-01: two engines in the bay, each in
   its own livery -- SuperNova amber, the NUC teal. */
const MACHINES = {
  supernova: {
    accent:'#e8a33d', dials:[
      {id:'cpu',  label:'CPU',      unit:'%',   max:100, red:85},
      {id:'ram',  label:'RAM',      unit:'%',   max:100, red:88},
      {id:'gpu',  label:'GPU',      unit:'%',   max:100, red:90},
      {id:'vram', label:'VRAM',     unit:'%',   max:100, red:92},
      {id:'temp', label:'GPU TEMP', unit:'°C',  max:100, red:80},
      {id:'net',  label:'NETWORK',  unit:'Mb/s',max:1000,red:900},
      {id:'ping', label:'PING',     unit:'ms',  max:200, red:120},
    ]},
  nuc: {
    accent:'#5ec8c0', dials:[
      {id:'cpu',  label:'CPU',      unit:'%',   max:100, red:85},
      {id:'ram',  label:'RAM',      unit:'%',   max:100, red:88},
      {id:'temp', label:'CPU TEMP', unit:'°C',  max:100, red:85},
      {id:'net',  label:'NETWORK',  unit:'Mb/s',max:1000,red:900},
      {id:'ping', label:'PING',     unit:'ms',  max:200, red:120},
    ]},
};
const R = 78, CX = 95, CY = 95;

for(const [mk, m] of Object.entries(MACHINES)){
  m.byId = {};
  for(const d of m.dials){
    const box = document.createElement('div');
    box.className = 'dial';
    box.innerHTML = `<canvas width="190" height="168"></canvas>`;
    document.getElementById(`dials-${mk}`).appendChild(box);
    m.byId[d.id] = {...d, accent:m.accent,
                    ctx: box.querySelector('canvas').getContext('2d'),
                    val: 0, shown: 0};
  }
}

function drawDial(d){
  const g = d.ctx;
  g.clearRect(0,0,190,168);
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;   // 240° sweep
  g.lineWidth = 10; g.lineCap = 'round';
  g.strokeStyle = '#0d0b08';
  g.beginPath(); g.arc(CX,CY,R,a0,a1); g.stroke();
  const redA = a0 + (a1-a0) * (d.red/d.max);
  g.strokeStyle = 'rgba(200,69,44,.55)';
  g.beginPath(); g.arc(CX,CY,R,redA,a1); g.stroke();
  g.strokeStyle = '#9c7a3c'; g.lineWidth = 2;
  for(let i=0;i<=8;i++){
    const a = a0 + (a1-a0)*i/8;
    g.beginPath();
    g.moveTo(CX+Math.cos(a)*(R-9), CY+Math.sin(a)*(R-9));
    g.lineTo(CX+Math.cos(a)*(R+6), CY+Math.sin(a)*(R+6));
    g.stroke();
  }
  d.shown += (d.val - d.shown) * 0.25;
  const frac = Math.max(0, Math.min(1, d.shown/d.max));
  const a = a0 + (a1-a0)*frac;
  g.strokeStyle = d.shown >= d.red ? '#c8452c' : d.accent;
  g.lineWidth = 3.5;
  g.beginPath(); g.moveTo(CX,CY);
  g.lineTo(CX+Math.cos(a)*(R-14), CY+Math.sin(a)*(R-14)); g.stroke();
  g.fillStyle = '#9c7a3c';
  g.beginPath(); g.arc(CX,CY,5,0,7); g.fill();
  g.fillStyle = '#f3e9d7'; g.textAlign = 'center';
  g.font = '700 15px "Segoe UI"';
  const shown = d.id==='net' ? d.val.toFixed(1) : Math.round(d.shown);
  g.fillText(`${shown}${d.unit}`, CX, CY+34);
  g.fillStyle = '#8a7a5c'; g.font = '600 10px "Segoe UI"';
  g.fillText(d.label, CX, CY+50);
  if(d.extra){ g.fillText(d.extra, CX, CY+63); }
}

function bars(mk, list){
  document.getElementById(`bars-${mk}`).innerHTML = list.map(b => `
    <div class="bar"><div class="lab">${b.label}</div>
      <div class="track"><div class="fill" style="width:${b.pct}%"></div></div>
      <div class="val">${b.val}</div></div>`).join('');
}

function feed(mk, d){
  const m = MACHINES[mk];
  document.getElementById(`stale-${mk}`).style.display = d.stale ? 'block' : 'none';
  document.getElementById(`sub-${mk}`).textContent = d.error
    ? 'no feed yet'
    : `up ${d.uptime_hours ?? '?'}h · sampled ${d.age_seconds}s ago`;
  const set = (id, v) => { if (m.byId[id]) m.byId[id].val = v ?? 0; };
  set('cpu', d.cpu_pct);
  set('ram', d.ram_pct);
  if (m.byId.gpu)  m.byId.gpu.val  = d.gpu?.util_pct ?? 0;
  if (m.byId.vram){
    m.byId.vram.val = d.gpu ? 100*d.gpu.vram_used_mb/d.gpu.vram_total_mb : 0;
    m.byId.vram.extra = d.gpu ? `${(d.gpu.vram_used_mb/1024).toFixed(1)} / ${(d.gpu.vram_total_mb/1024).toFixed(1)} GB` : '';
  }
  if (m.byId.temp) m.byId.temp.val = (d.gpu?.temp_c ?? d.temp_c) ?? 0;
  const nic = (d.net||[])[0] || {};
  if (m.byId.net){
    m.byId.net.val = (nic.rx_mbps||0) + (nic.tx_mbps||0);
    m.byId.net.extra = `↓${(nic.rx_mbps||0).toFixed(1)} ↑${(nic.tx_mbps||0).toFixed(1)}`;
  }
  const pings = Object.values(d.latency_ms||{}).filter(v=>v!=null);
  if (m.byId.ping) m.byId.ping.val = pings.length ? Math.max(...pings) : 0;
  bars(mk, (d.drives||[]).map(dr => ({
    label: `${dr.name.length<=2 ? 'Drive '+dr.name+':' : dr.name}`,
    pct: Math.round(dr.pct_used ?? 0),
    val: `${(dr.free_gb??0).toFixed(0)} GB free of ${(dr.total_gb??0).toFixed(0)}`,
  })));
}

async function tick(){
  try{
    const r = await fetch('engine/data', {cache:'no-store'});
    const d = await r.json();
    const ms = d.machines || { supernova: d };
    feed('supernova', ms.supernova || {stale:true, error:'missing'});
    feed('nuc',       ms.nuc       || {stale:true, error:'missing'});
  }catch(e){
    document.getElementById('stale-supernova').style.display='block';
    document.getElementById('stale-nuc').style.display='block';
  }
}

function loop(){
  for(const m of Object.values(MACHINES))
    for(const d of Object.values(m.byId)) drawDial(d);
  requestAnimationFrame(loop);
}
loop();
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
