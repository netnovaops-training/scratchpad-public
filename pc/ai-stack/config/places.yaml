# =============================================================================
#  Places — a local directory for North Las Vegas and the Las Vegas valley.
#
#  WHY THIS FILE EXISTS
#  The assistant should answer "where could she take Mom on a Tuesday?" from
#  disk in a millisecond, not by searching the web mid-call while an 80-year-old
#  listens to silence. Everything here is loaded once at startup.
#
#  ACCURACY RULES — these are the point of the file, please keep them.
#    * Every entry was verified against an official source. The URL is on the
#      entry. If you add one, add its source.
#    * A missing phone or zip means it was not published. It is NOT an
#      invitation to guess. A wrong address sends a frail person to the wrong
#      building.
#    * `verified:` is when a human or a research pass last confirmed it.
#    * `stale: high` means this category churns and the entry should be
#      re-checked before it is relied on. See the notes at the bottom.
#
#  A NOTE ON THE MEDICAL ENTRIES
#  Listing dialysis centres and hospices here is fine — it is public business
#  information about companies, not information about a client.
#
#  What is NOT fine is writing "took Mrs A to DaVita Lake Mead" into a client
#  record, because that records a kidney condition. telephony/app/phi.py
#  generalises destinations to "medical appointment" plus the address for
#  exactly this reason. Use this file to FIND the address; let the record keep
#  only the address.
#
#  Verified: 2026-08-18
# =============================================================================

meta:
  region: North Las Vegas and the Las Vegas valley, Nevada
  verified: 2026-08-18
  timezone: America/Los_Angeles

# -----------------------------------------------------------------------------
#  SOMEWHERE TO BE — the heart of this business.
#
#  This is the section nobody else has a list of. Everything below is a place a
#  companion can actually sit with someone for two hours.
# -----------------------------------------------------------------------------

senior_centers:
  - name: Neighborhood Recreation Center (North Las Vegas Senior Center)
    address: 1638 N. Bruce St., North Las Vegas, NV 89030
    phone: "555-0100"
    hours: Mon-Fri 8am-7pm, Sat 8am-2pm, closed Sunday
    good_for: [billiards, cards, classes, excursions, indoor]
    notes: >
      Home of the city's Social Seniors Club. The State of Nevada lists this as
      the official North Las Vegas senior center. City pages disagree on whether
      it opens at 8 or 9am — call first.
    source: https://www.cityofnorthlasvegas.com/things-to-do/parks-and-recreation/seniors

  - name: Silver Mesa Recreation Center
    address: 4025 Allen Lane, North Las Vegas, NV 89032
    phone: "555-0101"
    hours: Mon-Fri 8am-7pm, Sat 8am-2pm, closed Sunday
    ages: 55+
    good_for: [indoor, fitness, art_studio, classes, summer_refuge]
    notes: >
      The city's designated 55+ centre. Gym, multi-purpose rooms, dance studio,
      art studio, adjacent pool. Good indoor refuge in summer. No membership
      fee published.
    source: https://www.cityofnorthlasvegas.com/things-to-do/parks-and-recreation/seniors

  - name: Skyview Multi-Generational Center
    address: 3050 E. Centennial Parkway, North Las Vegas, NV 89081
    phone: "555-0102"
    hours: Mon-Thu 6am-8pm, Fri 6am-7pm, Sat 7am-4pm, closed Sunday
    good_for: [indoor, early_morning, fitness, summer_refuge]
    notes: >
      Largest NLV indoor facility and the longest hours — opens at 6am, which
      is the useful window in July and August.
    source: https://www.cityofnorthlasvegas.com/things-to-do/recreation-centers

  - name: Doolittle Active Adult Center
    address: 1930 N. J St., Las Vegas, NV 89106
    phone: "555-0103"
    hours: Mon-Fri 8am-5pm
    ages: 50+
    cost: $10 annual membership for classes and activities
    good_for: [indoor, cards, crafts, classes, dance]
    notes: >
      Closest city-of-Las-Vegas active adult centre to central North Las Vegas.
      ADDRESS CONFLICT — the city says 1930 N. J St., the state directory says
      1950. Same phone. Confirm before a first visit.
    source: https://www.lasvegasnevada.gov/Residents/Parks-Facilities/Doolittle-Active-Adult-Center

  - name: Howard Lieburn Active Adult Center
    address: 6230 Garwood Ave., Las Vegas, NV 89107
    phone: "555-0104"
    hours: 8am-5pm
    ages: 50+
    cost: $10 annual membership
    good_for: [gardening, crafts, dance, yoga, seasonal_trips]
    notes: The gardening programme suits a client who used to garden and can no longer manage their own.
    source: https://www.lasvegasnevada.gov/Residents/Parks-Facilities/Howard-Lieburn-Senior-Center

  - name: Centennial Hills Active Adult Center
    address: 6601 N. Buffalo Drive, Las Vegas, NV 89131
    phone: "555-0105"
    hours: Mon-Fri 7am-5pm
    cost: $10/year membership; fitness pass $10 for 30 days
    good_for: [chair_yoga, cards, bridge, pinochle, quilting, painting, book_club]
    notes: >
      Chair yoga and card games are the most companion-friendly activities here.
      Directly next to Centennial Hills Library — the two combine into one outing.
    source: https://files.lasvegasnevada.gov/parks-recreation/Centennial-Hills-Active-Adult-Center/2025-June-Aug-Centennial_Hills_activity-calendar.pdf

  - name: Cora Coleman Senior Center
    address: 2100 Bonnie Lane, Las Vegas, NV 89156
    phone: "555-0106"
    hours: Mon-Fri 7:15am-5pm
    good_for: [indoor, indoor_pool, game_room, summer_refuge]
    notes: Closest Clark County senior centre to east North Las Vegas. Cost not published.
    source: https://www.clarkcountynv.gov/government/departments/parks___recreation/seniors_centers/cora_coleman_senior_center/

  - name: West Flamingo Senior Center
    address: 6255 W. Flamingo Rd., Las Vegas, NV 89103
    phone: "555-0107"
    hours: Mon-Fri 8am-5pm, closed weekends
    ages: 50+
    good_for: [lending_library, cards, crafts, quiet, shaded_outdoor]
    notes: >
      Lending library plus a card room is a strong quiet-companionship setup.
      Attached park has benches, shade structure, restrooms and a walking course.
    source: https://www.clarkcountynv.gov/government/departments/parks___recreation/seniors_centers/west_flamingo_senior_center/

libraries:
