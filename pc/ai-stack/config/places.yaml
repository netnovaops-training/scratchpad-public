adult_day_and_respite:
  - name: Nevada Senior Services — Adult Day Care Center of Las Vegas
    address: 901 N. Jones Blvd., Las Vegas, NV 89108
    phone: "555-0120"
    caregiver_line: "555-0121"
    hours: Mon-Fri 7am-5:30pm, Sat 8am-6pm
    notes: >
      Saturday coverage is unusual and valuable. Dedicated memory care
      programming. Accepts Medicaid and HCBW; states no one is turned away on
      ability to pay. Also runs in-home respite and caregiver support groups.
    source: https://www.nevadaseniorservices.org/faqs

  - name: Helping Hands of Vegas Valley
    address: 3680 S. Maryland Parkway, Suite 526, Las Vegas, NV 89169
    phone: "555-0122"
    hours: Mon-Thu 8am-2pm
    notes: >
      MOVED — many directories still list 3640 N. 5th St. in North Las Vegas.
      Serves low-income frail adults 60+ including North Las Vegas. All five
      programmes free to clients: transport, meals, case management, minor home
      repair, respite. They run a FRIENDLY VISITOR service — a natural referral
      partner, worth calling early.
    source: https://hhovv.org/about-us/

  - name: Catholic Charities of Southern Nevada
    address: 1501 Las Vegas Blvd. North, Las Vegas, NV 89101
    phone: "555-0123"
    notes: Meals on Wheels and a community dining facility. Referral partner, not a destination.
    source: https://www.catholiccharities.com/contact

helplines:
  - name: Nevada Care Connection Resource Center (Clark County) — Jewish Family Service Agency
    phone: "555-0124"
    email: user7@example.com
    notes: >
      The single best referral entry point for a North Las Vegas senior.
      Options counselling, caregiver support, benefits navigation. Nevada has NO
      standalone Clark County Area Agency on Aging — any list claiming one is wrong.
    source: https://www.nevadacareconnection.org/contact-us/

  - name: Nevada Care Connection (statewide)
    phone: "555-0125"
    source: https://www.nevadacareconnection.org/contact-us/

  - name: Elder Protective Services — Clark County
    phone: "555-0126"
    notes: >
      ELDER ABUSE REPORTING. NRS 200.5093 gives a personal-care-in-the-home
      agency 24 HOURS to report suspected abuse, neglect or exploitation, and
      failure to report is a misdemeanour. This is the number.
    source: https://adsd.nv.gov/Contact/Contact_AllOffices

  - name: Elder Protective Services — statewide
    phone: "555-0127"
    source: https://adsd.nv.gov/Contact/Contact_AllOffices

transport:
  - name: RTC Paratransit (ADA)
    phone: "555-0128"
    certification_line: "555-0129"
    cost: $3.00 one way; 10-ride coupon book $30
    notes: >
      Runs 24 hours, reservation-based, within 3/4 mile of a bus route.
      Eligibility is FUNCTIONAL, not medical — a diagnosis alone doesn't
      qualify, and there's a mock bus trip assessment. Five minutes to board
      once the window opens.
    source: https://www.rtcsnv.com/ways-to-travel/paratransit-accessibility/

  - name: RTC Silver STAR
    phone: "555-0130"
    cost: $0.50 per boarding, exact change
    notes: >
      Neighbourhood loops (routes 703-718) serving senior communities, centres
      and groceries. Open to anyone, no certification. BUT each route runs only
      1-2 days a week on a fixed loop — no door-to-door, and nobody waits with
      the client.
    source: https://www.rtcsnv.com/ways-to-travel/fares-passes/

  - name: RTC Reduced Fare
    phone: "555-0130"
    cost: $1 single ride residential routes; $32.50 for 30 days
    eligibility: 60+, disabled, Medicare-eligible, active military, veterans
    source: https://www.rtcsnv.com/ways-to-travel/fares-passes/reduced-fare/

