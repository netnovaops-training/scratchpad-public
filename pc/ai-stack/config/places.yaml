  # County. Cards are not interchangeable. Worth knowing before promising anything.
  - name: Aliante Library
    district: North Las Vegas Library District
    address: 2400 W. Deer Springs Way, North Las Vegas, NV 89084
    phone: "555-0108"
    hours: Mon-Tue 10:30am-8pm, Wed-Thu 9am-9pm, Fri-Sat 9am-6pm
    good_for: [quiet, no_stairs, newspapers, magazines, indoor, free]
    notes: Single-storey — no stairs anywhere, which matters for a client with a walker.
    source: https://www.cityofnorthlasvegas.com/Home/Components/FacilityDirectory/FacilityDirectory/113/680

  - name: Alexander Library
    district: North Las Vegas Library District
    address: 1755 W. Alexander Road, North Las Vegas, NV 89032
    phone: "555-0109"
    good_for: [quiet, spanish_language, indoor, free]
    notes: Hours not published on the city page — call to confirm.
    source: https://www.cityofnorthlasvegas.com/residents/libraries

  - name: North Las Vegas City Hall Library
    district: North Las Vegas Library District
    address: 2250 Las Vegas Blvd. North, North Las Vegas, NV 89030
    phone: "555-0110"
    good_for: [quiet, indoor, free, easy_parking]
    notes: Inside City Hall — air conditioned, secure, civic parking. Hours not published.
    source: https://www.cityofnorthlasvegas.com/residents/libraries

  - name: West Las Vegas Library
    district: Las Vegas-Clark County
    address: 1861 N. Martin Luther King Jr. Blvd., Las Vegas, NV 89106
    phone: "555-0111"
    hours: Mon-Thu 10am-8pm, Fri-Sun 10am-6pm
    good_for: [art_gallery, performances, quiet, indoor, free, open_seven_days]
    notes: >
      MOVED — new building opened December 2025 at the MLK Blvd address. Older
      directories still say 951 W. Lake Mead Blvd; that is wrong.
      Rotating art galleries and live performances make this the best
      "something to look at and talk about" stop in the north valley, and it is
      open seven days a week.
    source: https://thelibrarydistrict.org/locations/wv/

  - name: Centennial Hills Library
    district: Las Vegas-Clark County
    address: 6711 N. Buffalo Dr., Las Vegas, NV 89131
    phone: "555-0112"
    hours: Mon-Thu 10am-8pm, Fri-Sun 10am-6pm
    good_for: [quiet_room, art_gallery, accessible_parking, indoor, free]
    notes: >
      Has a dedicated Quiet Room. Accessible parking near the south entrance,
      ramp, automatic doors. Next to the Active Adult Center and Centennial
      Hills Park — three stops in one trip.
    source: https://thelibrarydistrict.org/locations/ch/

parks:
  # North Las Vegas parks: 6am-11pm daily. In summer the usable window is
  # roughly 6-9am. That is not a detail — it decides whether the outing works.
  - name: Craig Ranch Regional Park
    address: 628 W. Craig Road, North Las Vegas, NV 89032
    phone: "555-0113"
    hours: 6am-11pm daily
    good_for: [shade, reservable_ramadas, community_garden, mature_trees, amphitheatre]
    notes: >
      ~170 acres with EIGHT RESERVABLE RAMADAS — the best shaded seating in
      North Las Vegas, and reservable so you aren't competing for it. Built on a
      former golf course so it has mature trees, which is rare here. Community
      garden with reservable planter boxes: excellent low-exertion activity.
    source: https://www.cityofnorthlasvegas.com/things-to-do/parks-and-recreation/parks/craig-ranch-regional-park

  - name: Aliante Nature Discovery Park
    address: 2627 Nature Park Drive, North Las Vegas, NV 89084
    hours: 6am-11pm daily
    good_for: [lake, waterfall, ducks, gazebos, shade, restrooms, flat_paths, benches]
    notes: >
      Confirmed on the city page: restrooms, gazebos and shade structures,
      picnic tables. Water feature plus shade plus flat paths is close to ideal
      for low mobility, and the waterfall and ducks give a passive focal point
      for someone who can't converse much. Splash pad means families mid-day —
      go early.
    source: https://www.cityofnorthlasvegas.com/Home/Components/FacilityDirectory/FacilityDirectory/73/777

  - name: Lorenzi Park
    address: 3333 W. Washington Ave., Las Vegas, NV 89107
    hours: 7am-11pm
    good_for: [twin_lakes, waterfowl, shade, benches, historic_markers, mature_landscaping]
    notes: >
      Historic district with interpretive markers — a built-in conversational
      walk for someone who lived through that history. Originally developed
      1926, later the Twin Lakes Lodge resort. Do not feed the wildlife.
    source: https://www.lasvegasnevada.gov/Residents/Parks-Facilities/Lorenzi-Park

  - name: Floyd Lamb Park at Tule Springs
    address: 9200 Tule Springs Road, Las Vegas, NV 89131
    phone: "555-0114"
    hours: Apr-Sep 8am-8pm; Oct-Mar 8am-5pm
    cost: $6 per vehicle, CARD ONLY at the gate. Household pass $50/yr, $25 senior.
    good_for: [drive_up_picnic, heavy_shade, ponds, peafowl, restrooms, historic_barn]
    notes: >
      YOU CAN DRIVE RIGHT UP TO MOST PICNIC AREAS. That matters more than
      anything else on this list for a client who cannot walk far from the car.
      Buy the $25 senior annual pass if this becomes regular.
    source: https://www.lasvegasnevada.gov/Residents/Parks-Facilities/Floyd-Lamb-Park

indoor_summer:
  # May-September, outdoor plans mostly don't work. These are the fallbacks.
  - name: Meadows Mall
    address: 4300 Meadows Lane, Las Vegas, NV 89107
    phone: "555-0115"
    hours: Mon-Thu 11am-7pm, Fri-Sat 11am-8pm, Sun 11am-6pm
    cost: free
    good_for: [free_wheelchairs, massage_chairs, mall_walking, air_conditioned, seating]
    notes: >
      THE default hot-weather fallback. Free wheelchairs from security on level
      2 near JCPenney. Massage chairs throughout. Mall walking programme —
      doors open an hour before the mall does, one lap is about half a mile.
      Safety escorts on (702) 880-6692. Costs nothing.
    source: https://www.meadowsmall.com/en/visit/

  - name: Las Vegas Science & Natural History Museum
    address: 900 Las Vegas Blvd. N, Las Vegas, NV 89101
    phone: "555-0116"
    hours: daily 9am-4pm
    cost: adults $14, seniors/military/students $12, Nevada residents $1 off with ID
    good_for: [free_wheelchairs, fully_accessible, free_close_parking, open_daily, small_scale]
    notes: >
      The strongest paid indoor option for a frail client: complimentary
      wheelchairs, elevators and ramps throughout, free parking directly behind
      the building including covered spaces, open seven days, and small enough
      not to exhaust anyone. Also the most geographically convenient museum for
      North Las Vegas.
    source: https://www.lvnhm.org/plan-your-visit

  - name: Springs Preserve
    address: 333 S. Valley View Blvd., Las Vegas, NV 89107
    phone: "555-0117"
    hours: Thu-Mon 9am-4pm — CLOSED TUESDAY AND WEDNESDAY
    cost: Nevada resident $9.95 adult, $8.95 senior. Non-resident $18.95 / $17.95.
    good_for: [botanical_gardens, butterfly_habitat, indoor_galleries]
    notes: >
      Members get outdoor access from 8am, and 8-9am is the only comfortable
      outdoor window in summer — worth a membership if the client can't take heat.
    source: https://www.springspreserve.org/visitor-information/tickets.html

  - name: Nevada State Museum, Las Vegas
    address: 309 S. Valley View Blvd., Las Vegas, NV 89107
    phone: "555-0118"
    hours: Thu-Mon 9am-4pm, closed Tue/Wed
    cost: Nevada resident $9.95 adult. Senior and military discounts with ID.
    good_for: [nevada_history, indoor, conversation_prompts]
    notes: >
      Nevada history from prehistory to now — good prompt material for someone
      with long local memory. Navigate to 333 S. Valley View (Springs Preserve
      parking), not the museum's own address.
    source: https://www.lasvegasnvmuseum.org/location-directions/

  - name: Clark County Wetlands Park & Nature Center
    address: 7050 Wetlands Park Lane, Las Vegas, NV 89122
    phone: "555-0119"
    hours: Nature Center Tue-Sun 9am-3pm; trails dawn to dusk
    cost: free
    good_for: [climate_controlled_picnic, paved_trail, dioramas, films, free]
    notes: >
      The "Lizard Lounge" is a climate-controlled picnic area with seating
      overlooking the preserve — exactly what this service needs in August, and
      free. Paved trail section between the Wetlands Loop and Pabco trailheads.
      Check the alerts page: the loop trail doesn't currently complete, and
      there's sewer work on Nature Preserve Way. East valley, a real drive.
    source: https://www.clarkcountynv.gov/government/departments/parks___recreation/wetlands_park/

