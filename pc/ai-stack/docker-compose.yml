# =============================================================================
#  Local AI Stack - Docker Desktop for Windows
#
#  Everything appears in Docker Desktop under one group: "ai-stack".
#  Start it, stop it, read logs, and open the Hermes CLI from the Containers tab.
#
#  Design rules baked in:
#   * Every host port is bound to 127.0.0.1 -> nothing is reachable from your
#     network. Open WebUI and the CLI are local-only by design.
#   * Everything talks to `litellm` (one OpenAI-compatible endpoint) instead of
#     talking to ollama directly, so you swap models by editing one file.
#   * The Telegram bridge uses long polling (outbound only). No inbound port,
#     no webhook, no port forwarding on your router.
#   * Every surface writes to the same transcripts folder as JSONL.
# =============================================================================

name: ai-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------------------
  # 1. Ollama - local model runtime (uses your NVIDIA GPU)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "model runtime (GPU)"
      ai-stack.order: "1"
    # No host ports published -- see the comments below. Every consumer
    # reaches Ollama at http://ollama:11434 on the Docker network.
    ports:
      - "127.0.0.1:11434:11434"   # restored 2026-11-05 for the plant pipeline (setup-gpu-rotation.ps1)
      # Loopback for everything on this PC, exactly as before.
      # DISABLED 2026-09-13. A native Windows Ollama install holds
      # :::11434 (the IPv6 wildcard, which claims IPv4 too on Windows),
      # so Docker cannot bind this and the container refuses to START.
      # That second Ollama has NO models -- anything on the host that
      # used localhost:11434 was talking to an empty one.
      #
      # TO RESTORE: kill the native Ollama from an ELEVATED prompt and
      # remove its Startup shortcut, then uncomment this line:
      #     taskkill /F /IM "ollama app.exe" /T
      #     taskkill /F /IM ollama.exe /T
      # Nothing in the stack needs this line: LiteLLM and the other
      # containers reach Ollama at http://ollama:11434 on the Docker
      # network, not through the host.
      # (the loopback line is now active above)
      # ALSO on this PC's LAN address, added 2026-08-28, so the NUC's
      # garden orchestrator can use phi4 to fill in missing plant data
      # instead of calling a paid cloud API.
      #
      # Bound to the LAN IP, NOT 0.0.0.0. That is the important part: the
      # NUC's haproxy-relay only forwards 80/443/9443/9444/9445, so this
      # port is not reachable from the internet -- but binding it to every
      # interface would still be sloppier than naming the one that needs it.
      #
      # It is worth being clear-eyed: Ollama has NO authentication. Anything
      # on the home LAN can now use the GPU and query the models. That is the
      # trade for letting the NUC use it, and it is why this is a specific
      # address rather than a wildcard.
      # CORRECTED 2026-09-13: was 192.168.1.205, an address this PC no
      # longer has (its reservation moved it to .100), so the NUC could
      # not actually reach the GPU through it.
      # ALSO DISABLED 2026-09-13, same cause: the native Windows Ollama
      # binds :::11434, the IPv6 wildcard, which on Windows claims every
      # IPv4 address too -- so NO host address can be bound here, not
      # just localhost. With both lines out, ollama publishes no host
      # port at all and starts cleanly. Every consumer in this stack
      # reaches it as http://ollama:11434 on the Docker network.
      #
      # The NUC loses its direct route to the GPU until the native
      # Ollama is removed. That route was ALREADY broken -- it pointed
      # at .205, an address this PC no longer has.
      # - "192.168.1.100:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # NAMESPACED 2026-09-13. Compose reads ${VAR} from the shell
      # environment before .env, and this machine had OLLAMA_KEEP_ALIVE=-1
      # in the USER environment and =24h in the MACHINE environment, left
      # by the native Ollama installer. So .env's 10m lost silently and
      # models were pinned in VRAM forever -- which is the opposite of
      # what Jason asked for ("evict and serve the best at the moment").
      # AI_STACK_-prefixed names cannot be hijacked that way.
      - OLLAMA_KEEP_ALIVE=${AI_STACK_OLLAMA_KEEP_ALIVE:-10m}
      - OLLAMA_MAX_LOADED_MODELS=${AI_STACK_OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_FLASH_ATTENTION=1
      # 2026-10-26, tried for the plant-data run and reverted: OLLAMA_KV_CACHE_TYPE=q8_0 made
      # llama-server abort on load; OLLAMA_NUM_PARALLEL=2 pushed phi4 17% onto the CPU (vs 5%).
      # On this 12 GB card one slot is fastest.
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    # GPU passthrough. Docker Desktop honours this when the WSL2 backend is on
    # and you have a current NVIDIA driver installed on Windows.
    # No GPU? Use the CPU override:  docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
    #
    # THIS STANZA IS LOAD-BEARING AND MUST STAY ATTACHED TO OLLAMA. On
    # 2026-08-31 a new service was inserted between ollama's environment
    # block and this deploy stanza, which silently reattached it (and the
    # healthcheck above) to the new service. The next recreate brought
    # ollama up with NO GPU AT ALL -- "total_vram=0 B", every model on CPU,
    # nothing erroring anywhere. If ollama is ever mysteriously slow, check
    # this stanza still belongs to ollama before debugging anything else.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  #  ai-tagger -- looks at every Immich photo with a local vision model and
  #  tags what is in it (animals, plants by name, buildings, kinds of place).
  #
  #  Faces are deliberately NOT its job: Immich's own recognition clusters
  #  those, and naming them happens in Immich's People page.
  #
  #  Every tag it writes lives under "ai/" -- that namespace is the review
  #  mechanism. Browse a tag in Immich, remove it from photos it got wrong,
  #  add your own (unprefixed) tags; nothing is ever re-tagged behind a
  #  reviewer's back, because the processed-list in tagger_data remembers
  #  what has been judged.
  #
  #  IT SHARES ONE 12GB CARD WITH HERMES' phi4, and the card cannot hold
  #  both. The arrangement (Jason's design): the tagger takes the GPU when it
  #  is quiet, backs off for ten minutes the moment anything else loads, and
  #  when the whole backlog is finished reloads phi4 itself -- so the ~20s
  #  model-swap cost lands on this batch job, never on a sentence Jason is
  #  waiting for Hermes to answer.
  # ---------------------------------------------------------------------------
  ai-tagger:
    # RETIRED 2026-11-03 (Jason): data kept. Back: docker compose --profile retired up -d ai-tagger
    # 2026-11-12: its code moved to D:\ai-stack-archive\outdated\tagger\ in the clean-up; copy it
    # back to ./tagger before bringing this service back.
    profiles: ["retired"]
    build:
      context: ./tagger
    image: ai-stack/ai-tagger:latest
    container_name: ai-tagger
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "photo auto-tagging (vision model, tags under ai/)"
    depends_on:
      - ollama
    environment:
      # THE LAN ADDRESS, NOT THE PUBLIC ONE. This used to point at
      # photos.home.example.net, which sent every thumbnail
      # fetch out through DuckDNS to the public IP, back in through the
      # router, the NUC's relay and Caddy -- to reach a machine on the
      # same LAN. Measured 2026-09-21: 171 ms against 4 ms, and it was
      # the source of the "Temporary failure in name resolution" and
      # "SSL: UNEXPECTED_EOF" errors that were costing whole photos.
      #
      # At two calls per photo across 79,642 photos that round trip was
      # about seven hours of pure latency. HOUSE_IMMICH_URL elsewhere in
      # this file already used the LAN address; the tagger was the odd
      # one out.
      - IMMICH_URL=${IMMICH_URL:-http://192.168.1.86:2283}
      # An Immich API key. TAGS BELONG TO THE KEY'S ACCOUNT -- this one is
      # Jason's, so it tags Jason's library. Other people's libraries need
      # their own keys once their accounts exist.
      - 'IMMICH_API_KEY=${IMMICH_TAGGER_KEY:-}'
      - OLLAMA_URL=http://ollama:11434
      - VISION_MODEL=${TAGGER_VISION_MODEL:-gemma4:12b}
      - RESTORE_MODEL=${TAGGER_RESTORE_MODEL:-gemma4:12b}
      - GPU_COOLDOWN_SECONDS=${TAGGER_COOLDOWN:-600}
      - SWEEP_MINUTES=${TAGGER_SWEEP_MINUTES:-60}
    volumes:
      - tagger_data:/data

  # ---------------------------------------------------------------------------
  # 2. One-shot model puller. Runs, pulls, exits. It is SUPPOSED to show up
  #    as "Exited (0)" in Docker Desktop when it's finished - that's success.
  #    Re-run it any time you add a model to PULL_MODELS in .env.
  # ---------------------------------------------------------------------------
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama_init
    labels:
      ai-stack.role: "one-shot model downloader (exits when done)"
      ai-stack.order: "2"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PULL_MODELS=${PULL_MODELS:-gemma4:12b nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for m in $${PULL_MODELS}; do
          echo "==> pulling $$m"
          ollama pull "$$m" || echo "!! failed to pull $$m (skipping)"
        done
        echo "==> all models ready"
    restart: "no"
    profiles: ["init"]

  # ---------------------------------------------------------------------------
  # 2b. Postgres - LiteLLM's database.
  #
  #  WHY THIS EXISTS AT ALL
  #  The LiteLLM admin UI cannot log you in without one. The login page reads
  #  like a password problem ("Authentication Error"), but the real message is
  #  the second half: "Not connected to DB!". LiteLLM writes a user record as
  #  part of logging in, and with nowhere to write it, the correct password
  #  fails exactly like a wrong one.
  #
  #  It also fixes something more useful than the UI. Without a database,
  #  LiteLLM's usage counters live in memory, so every restart resets your
  #  token totals to zero -- /usage can only ever tell you "since LiteLLM last
  #  started". With one, usage and spend accumulate properly over weeks.
  #
  #  NO HOST PORT, on purpose. Nothing outside Docker needs to reach this, so
  #  it is not published at all -- not even on 127.0.0.1. Only containers on
  #  the ai-stack network can see it.
  #
  #  THE PASSWORD IS ONLY READ ONCE. Postgres sets it when it first creates
  #  the data directory and never again. Changing LITELLM_DB_PASSWORD later
  #  will NOT change the database's actual password -- it will just make
  #  LiteLLM fail to log in. To really change it:
  #      docker compose down postgres
  #      docker volume rm ai-stack_litellm_db
  #      docker compose up -d postgres
  #  (that discards usage history, which is the only thing stored here)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: litellm_db
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "database for the router's UI and usage history"
      ai-stack.order: "2b"
    volumes:
      - litellm_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_DB=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD:?run env-sync.cmd - it generates this}
      # Postgres defaults to a very chatty log. This keeps it to things that
      # matter, so `logs.cmd postgres` is readable.
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 3. LiteLLM - THE ROUTER. This is what makes "the right model for each job"
  #    work. Everything else points here. Edit litellm/config.yaml to remap,
  #    then hit Restart on this container in Docker Desktop.
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "model router - edit litellm/config.yaml then restart me"
      ai-stack.order: "3"
    depends_on:
      ollama:
        condition: service_healthy
      # service_healthy, not service_started: LiteLLM runs its schema
      # migration on boot, and against a Postgres that is still starting that
      # fails and leaves the proxy up but database-less -- which presents as
      # the same "Not connected to DB!" this was added to fix.
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"     # localhost only
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?run setup.cmd first - it creates .env}
      - LITELLM_LOG=${LITELLM_LOG:-INFO}
      # --- the admin UI login (http://localhost:4000/ui) --------------------
      # WITHOUT these, LiteLLM's login is username `admin` and password = your
      # LITELLM_MASTER_KEY -- a 51-character key you have to go and copy out of
      # .env every single time. That is not a security feature, it is just
      # friction, and friction is what makes people paste secrets into places
      # they shouldn't.
      #
      # Set UI_USERNAME and UI_PASSWORD in .env for a login you can actually
      # type. Left blank, the master-key behaviour above still applies, so
      # nothing breaks if you never set them.
      #
      # Safe to keep simple: this UI is bound to 127.0.0.1 like everything
      # else, so it is not reachable from your network, let alone the
      # internet. It is a lock on a door inside the house.
      - UI_USERNAME=${UI_USERNAME:-}
      - UI_PASSWORD=${UI_PASSWORD:-}
      # The database. Without this the admin UI cannot log in at all, and
      # token counts reset to zero on every restart.
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      # Keeps model config in the database so edits made in the UI survive a
      # restart. config.yaml is still the source of truth on boot.
      - STORE_MODEL_IN_DB=${STORE_MODEL_IN_DB:-False}
      # Optional cloud providers. Blank = stay 100% local.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  # ---------------------------------------------------------------------------
  # 4. Open WebUI - the browser front end.
  #    In Docker Desktop, click the 3000:8080 link on this row to open it.
  # ---------------------------------------------------------------------------
  # OFF BY DEFAULT. Hermes is the interface now -- in the terminal, and the same
  # agent over Telegram. This is kept rather than deleted because turning it
  # back on is one flag and its chat history is still in the open_webui_data
  # volume, untouched:
  #     docker compose --profile webui up -d open-webui
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    restart: unless-stopped
    logging: *default-logging
    profiles: ["webui"]
    labels:
      ai-stack.role: "web interface - OFF by default, --profile webui to start"
      ai-stack.order: "4"
    depends_on:
      litellm:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"     # localhost only - no outside access
    volumes:
      - open_webui_data:/app/backend/data
      - ./transcripts:/transcripts
    environment:
      # --- models come from the router, so the dropdown shows job routes ---
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - ENABLE_OLLAMA_API=false
      # --- voice out: your cloned voice ---
      - AUDIO_TTS_ENGINE=openai
      # LuxTTS at 16 steps (the fast container's default): near-expressive
      # finish, instant renders -- Jason's 2026-09-01 revision after the
      # step flight. Telegram alone pins the 4-step quick path.
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://voice:8091/v1
      - AUDIO_TTS_OPENAI_API_KEY=none
      - AUDIO_TTS_MODEL=tts-1
      - AUDIO_TTS_VOICE=Jason
      # --- voice in: cloud STT is fine; the transcript is the point ---
      - AUDIO_STT_ENGINE=${AUDIO_STT_ENGINE:-}
      - AUDIO_STT_MODEL=${STT_MODEL:-whisper-1}
      - AUDIO_STT_OPENAI_API_BASE_URL=${STT_API_BASE:-https://api.openai.com/v1}
      - AUDIO_STT_OPENAI_API_KEY=${STT_API_KEY:-}
      # --- local-only posture ---
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - WEBUI_URL=http://localhost:3000
      - ENABLE_COMMUNITY_SHARING=false

  # ---------------------------------------------------------------------------
  # 5. Voice - Kokoro by default; LuxTTS for Dee's cloned voice. See VOICE_ENGINE.
  #
  #    Serves three consumers from ONE copy of the weights:
  #      POST /synthesize-array  the phone line
  #      POST /v1/audio/speech   OpenAI-compatible, for Open WebUI and Hermes
  #      POST /preview           a playable WAV, so you can audition a voice
  #
  #    Drop a clean 10-30s clip at voices/dee.wav and that becomes the voice.
  #    FIRST START IS SLOW - it downloads model weights. Watch the Logs tab.
  # ---------------------------------------------------------------------------
  voice:
    build:
      context: .
      dockerfile: voice/Dockerfile
    image: ai-stack/voice:latest
    container_name: voice
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "cloned voice - phone, web UI and CLI all use this"
      ai-stack.order: "5"
    ports:
      - "127.0.0.1:8091:8091"     # localhost only
    volumes:
      - ./voices:/voices
      - hf_cache:/root/.cache/huggingface
    environment:
      # Hand the GPU back when nobody is using it. See the
      # note in voice/server.py.
      - VOICE_IDLE_MINUTES=${VOICE_IDLE:-240}
      - VOICE_ENGINE=${VOICE_ENGINE:-luxtts}
      - VOICE_DEVICE=${VOICE_DEVICE:-cuda}
      - VOICE_DEFAULT=${VOICE_DEFAULT:-dee}
      - VOICES_DIR=/voices
      - VOICE_SPEEDS=${VOICE_SPEEDS:-}
      - VOICE_TUNE=${VOICE_TUNE:-}
      - LUXTTS_STEPS=${LUXTTS_STEPS:-4}
      - KOKORO_VOICE=${KOKORO_VOICE:-af_heart}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8091/health',timeout=3).status==200 else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 40
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # 5b. Streaming speech-to-text - faster-whisper on the GPU.
  #     ~1GB VRAM at small.en. Only needed for the phone line.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  #  voice-narrate -- the SAME image, the beautiful engine.
  #
  #  Jason judged the tribute's narration robotic, and he was right: LuxTTS
  #  is the fast engine (150x realtime keeps the PHONE line snappy) but flat.
  #  Chatterbox -- already shipped in this image, selectable by env -- is the
  #  expressive one: real prosody, natural pauses, emotion tags, cloned from
  #  the same Randy.wav. Two containers, one image, each consumer getting
  #  the engine its job needs: the phone keeps speed, the stories get soul.
  #  GPU: ~1.5GB, swapping politely with everything else on the card.
  # ---------------------------------------------------------------------------
  voice-narrate:
    # THE GIT BUILD, NOT THE PyPI ONE, and the reason is the emotion tags.
    #
    # Jason: "laugh says laugh not actual laughing". Measured objectively by
    # rendering "[laugh]" and sending the audio back through the household's
    # faster-whisper service to read what it actually contains:
    #
    #   chatterbox 0.1.7 (PyPI)   heard: "That is wonderful. Laugh!"
    #   chatterbox git build      heard: "That is wonderful."
    #                             and 32 KB LARGER than the untagged render
    #
    # Extra audio that transcribes as no extra words is laughter. PyPI 0.1.7
    # treats [laugh] as literal text and says it; the git build honours it.
    # ai-stack/voice-turbo:latest is that git build (see Dockerfile.turbo) --
    # the image, not the Turbo MODEL. VOICE_ENGINE below still selects full
    # Chatterbox, so this is the same engine Jason's ear approved, with
    # working tags.
    #
    # An earlier version of this measured DURATION instead and concluded the
    # tag worked, because speaking a word also takes time. Duration is not
    # evidence of laughter; a transcript is.
    image: ai-stack/voice-turbo:latest
    container_name: voice-narrate
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "expressive narration voice (chatterbox) - the tribute uses this"
    ports:
      - "127.0.0.1:8095:8091"     # localhost only, like its sibling
    volumes:
      - ./voices:/voices
      - hf_cache:/root/.cache/huggingface
    environment:
      # Hand the GPU back when nobody is using it. See the
      # note in voice/server.py.
      - VOICE_IDLE_MINUTES=${VOICE_NARRATE_IDLE:-20}
      - VOICE_ENGINE=chatterbox
      - VOICE_DEVICE=${VOICE_DEVICE:-cuda}
      - VOICE_DEFAULT=Randy
      - VOICE_SPEEDS=${VOICE_SPEEDS:-}
      - VOICE_TUNE=${VOICE_TUNE:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  #  voice-turbo -- Chatterbox Turbo TRIAL (2026-09-01). Candidate to replace
  #  LuxTTS in the quick slot: near-expressive quality at ~6x realtime.
  #  Jason's ear decides; until then nothing routes here.
  # ---------------------------------------------------------------------------
  voice-turbo:
    build:
      context: ./voice
      dockerfile: Dockerfile.turbo
    image: ai-stack/voice-turbo:latest
    container_name: voice-turbo
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "Chatterbox Turbo trial - the quick slot's challenger"
    ports:
      - "127.0.0.1:8096:8091"     # localhost only
    volumes:
      - ./voices:/voices
      - hf_cache:/root/.cache/huggingface
    environment:
      # Hand the GPU back when nobody is using it. See the
      # note in voice/server.py.
      - VOICE_IDLE_MINUTES=${VOICE_TURBO_IDLE:-10}
      - VOICE_ENGINE=chatterbox-turbo
      - VOICE_DEVICE=${VOICE_DEVICE:-cuda}
      - VOICE_DEFAULT=Jason
      - VOICES_DIR=/voices
      - VOICE_SPEEDS=${VOICE_SPEEDS:-}
      - VOICE_TUNE=${VOICE_TUNE:-}
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  #  voice-f5 -- F5-TTS TRIAL (2026-09-13). Jason asked for "the next voice
  #  TTS model that's a step up", and this is the candidate: the flow-matching
  #  model documented as the English quality leader, and specifically stronger
  #  than Chatterbox on LONG-FORM prosody -- the original complaint.
  #
  #  ~3GB VRAM, less than Chatterbox's 4GB. Nothing routes here until Jason's
  #  ear says so, same rule as voice-turbo.
  #
  #  IT NEEDS A TRANSCRIPT PER VOICE. F5-TTS's infer() takes ref_text with no
  #  default and does not transcribe for you. voice/transcribe-references.py
  #  writes those .txt files using the faster-whisper service already here.
  # ---------------------------------------------------------------------------
  voice-f5:
    build:
      context: ./voice
      dockerfile: Dockerfile.f5
    image: ai-stack/voice-f5:latest
    container_name: voice-f5
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "F5-TTS trial - the quality challenger for narration"
    ports:
      # 8097 belongs to audiobookshelf; 8099 was the next free one in
      # this range. Checked rather than assumed -- the siblings run on
      # 8091/8095/8096 and the obvious next number was taken.
      - "127.0.0.1:8099:8091"     # localhost only, like its siblings
    volumes:
      - ./voices:/voices
      - hf_cache:/root/.cache/huggingface
    environment:
      # Hand the GPU back when nobody is using it. See the
      # note in voice/server.py.
      - VOICE_IDLE_MINUTES=${VOICE_F5_IDLE:-10}
      - VOICE_ENGINE=f5
      - VOICE_DEVICE=${VOICE_DEVICE:-cuda}
      - VOICE_DEFAULT=Randy
      - VOICES_DIR=/voices
      - VOICE_SPEEDS=${VOICE_SPEEDS:-}
      - VOICE_TUNE=${VOICE_TUNE:-}
      # The two quality dials. Jason has said speed is not an issue on this
      # box, so these are what to raise if a voice still is not close enough.
      - F5_NFE_STEP=${F5_NFE_STEP:-32}
      - F5_CFG_STRENGTH=${F5_CFG_STRENGTH:-2.0}
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  #  colibri -- DeepSeek V4.1 Flash (552B) streamed from NVMe.
  #
  #  A different bet from ollama: instead of a model that FITS in 12 GB of
  #  VRAM, an engine that treats disk, RAM and VRAM as one tier and streams
  #  experts as routing demands them. 552B parameters, 16B active.
  #
  #  WHY THIS MODEL. Measured on this box, unbuffered 8 MB random reads:
  #  C: does 4.07 GB/s. On a streaming engine tokens/sec is bytes-per-token
  #  over disk speed, so ACTIVE parameters set the pace, not total ones:
  #      GLM-5.3-Flash  321B   4.8 GB/tok   0.85 tok/s
  #      DeepSeek V4.1  552B   4.5 GB/tok   0.90 tok/s   <- this
  #      GLM-5.2        744B  12.7 GB/tok   0.32 tok/s
  #  V4.1 Flash is lighter per token than a model 35% smaller than it.
  #
  #  PROFILE-GATED ON PURPOSE. The model is 510 GB and still downloading;
  #  a service pointed at a half-present model would restart-loop and add
  #  noise to every `docker ps` until it finished. Start it deliberately:
  #      docker compose --profile colibri up -d colibri
  #
  #  THE MODEL PATH IS A BIND MOUNT, NOT A VOLUME, and must be NVMe.
  #  Upstream: "keep it on NVMe/ext4, never a network mount -- expert
  #  streaming is latency-bound". G: and M: have more free space but are
  #  spinning SATA disks and would be hours per token.
  # ---------------------------------------------------------------------------
  colibri:
    profiles: ["colibri"]
    build:
      context: ./colibri
      dockerfile: docker/Dockerfile.cuda
    image: colibri:cuda
    container_name: colibri
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "DeepSeek V4.1 Flash 552B, streamed from NVMe"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - "${COLIBRI_MODEL_DIR:-C:/Models/DeepSeek-V4.1-Flash}:/model:ro"
      # The second drive's copy, when it exists. Read-only like the primary.
      # Harmless while D:\Models is empty or absent.
      - "${COLIBRI_MIRROR_DIR:-D:/Models/DeepSeek-V4.1-Flash}:/model-mirror:ro"
    environment:
      # Expert cache budget. Raising this is the single biggest speed lever
      # short of a faster disk -- a cached expert is served at RAM speed
      # instead of 4 GB/s.
      #
      # 10, NOT 24. The earlier 24 reasoned from the HOST's 61.6 GB, but
      # this container does not live on the host: it lives inside the WSL2
      # VM that Docker Desktop runs in, and ~/.wslconfig caps that VM at
      # 16 GB on purpose (see the reasoning in that file -- Ollama's weights
      # sit in VRAM, so the VM only ever ran light services). `docker info`
      # confirms 15.6 GB. Asking for a 24 GB expert cache inside a 15.6 GB
      # VM cannot work; it would thrash or be OOM-killed.
      #
      # THIS IS THE REAL CEILING ON COLIBRI HERE, and it is worth naming:
      # the whole point of the engine is caching experts in RAM, and inside
      # this VM it gets ~10 GB of cache for a 475 GB model. Two ways out,
      # both deliberate choices rather than defaults:
      #   * raise `memory` in ~/.wslconfig (needs wsl --shutdown, which
      #     restarts every container on this machine), or
      #   * run colibri natively on Windows instead of in Docker, where it
      #     sees all 61.6 GB.
      - COLI_RAM=${COLIBRI_RAM:-10}
      # TWO DRIVES AT ONCE. Expert reads are read-only, so a byte-identical
      # copy of the model on a second drive lets the engine stripe reads
      # across both. Measured here, unbuffered 8 MB random reads:
      #     C:  Samsung 990 EVO Plus   4.07 GB/s
      #     D:  MSI M450               2.34 GB/s
      #     together                   6.41 GB/s
      # At DeepSeek V4.1's 4.5 GB/token that is 0.90 -> 1.42 tok/s, a 58%
      # gain for a LOCAL COPY -- not a second download.
      #
      # A PARTIAL MIRROR IS FINE and this is the part that makes it safe to
      # try: only the shards actually present are used, divergent files
      # silently stay on the primary, and a read error on the mirror falls
      # back to the primary with one warning rather than crashing. So an
      # incomplete or half-copied D: cannot break the server.
      #
      # Empty until the copy exists -- an unset mirror is simply not used.
      - COLI_MODEL_MIRROR=${COLIBRI_MIRROR:-}
    command:
      - serve
      - --host
      - "0.0.0.0"
      - --model-id
      - deepseek-v4.1-flash-colibri
      - --ram
      # Must match COLI_RAM above; see the note there about the 16 GB WSL2
      # ceiling this container actually lives under.
      - "${COLIBRI_RAM:-10}"
      - --gpu
      - auto
    # Streaming a 552B model touches a lot of page cache.
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  stt:
    build:
      context: .
      dockerfile: stt/Dockerfile
    image: ai-stack/stt:latest
    container_name: stt
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "streaming speech-to-text for the phone line"
      ai-stack.order: "5b"
    ports:
      - "127.0.0.1:8092:8092"     # localhost only
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      # Hand the GPU back when nobody is using it. See the
      # note in stt/server.py.
      - STT_IDLE_MINUTES=${STT_IDLE:-240}
      - STT_MODEL_SIZE=${STT_MODEL_SIZE:-small.en}
      - STT_DEVICE=${STT_DEVICE:-cuda}
      - STT_COMPUTE_TYPE=${STT_COMPUTE_TYPE:-int8_float16}
      - STT_SILENCE_MS=${STT_SILENCE_MS:-700}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8092/health',timeout=3).status==200 else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 180s
    profiles: ["phone", "all"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # 5c. Voicebox - the voice studio, and the CLI's voice.
  #
  #     This is where you RECORD and AUDITION voices, with a real UI. It also
  #     exposes an MCP server that Hermes speaks through.
  #
  #     Note: there is no published image yet, so Compose builds it from the
  #     GitHub repo the first time. That build is slow (several minutes) and
  #     needs internet.
  # ---------------------------------------------------------------------------
  voicebox:
    build:
      context: https://github.com/jamiepine/voicebox.git
    image: ai-stack/voicebox:latest
    container_name: voicebox
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "voice studio + MCP voice for the CLI - open the port link"
      ai-stack.order: "5c"
    ports:
      - "127.0.0.1:17493:17493"   # localhost only
    volumes:
      - ./voices:/app/data/generations
      - voicebox_data:/app/data
      - hf_cache:/home/voicebox/.cache/huggingface
    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache
    profiles: ["studio", "all"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # 6. Hermes - the CLI agent.
  #    In Docker Desktop: click this container -> Exec tab -> type: hermes
  # ---------------------------------------------------------------------------
  hermes:
    build:
      context: .
      dockerfile: hermes/Dockerfile
    image: ai-stack/hermes:latest
    container_name: hermes
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "CLI agent - open the Exec tab and type: hermes"
      ai-stack.order: "6"
    depends_on:
      litellm:
        condition: service_healthy
    volumes:
      - ./workspace:/workspace
      # Read the tribute, append to the list. The map data lives on the NUC
      # and is not mountable from here; map_places says so honestly until a
      # LAN read for it exists (on PENDING).
      - ./web/public/peewee:/house/peewee:ro
      # Audio-Files (2026-11-12): see the caddy volumes in docker-compose.web.yml.
      - ./web/public/Audio-Files/peewee/music:/house/peewee/music:ro
      - ./web/public/Audio-Files/peewee/static-sounds:/house/peewee/static-sounds:ro
      - ./web/public/Audio-Files/peewee/audio:/house/peewee/audio:ro
      - ./web/public/Audio-Files/peewee/data/patter:/house/peewee/data/patter:ro
      - ./web/public/Audio-Files/peewee/data/intros:/house/peewee/data/intros:ro
      - ./PENDING.md:/house/PENDING.md
      # The n8n workflow files, read-only, mounted INSIDE /workspace so the
      # agent's existing file tools can read them with no code change --
      # tools.py confines everything to /workspace, and that confinement is
      # doing real work here, so this slips under it rather than widening it.
      #
      # Narrow on purpose. The parent folder (ai-stack) holds .env: the Twilio
      # auth token, the LiteLLM master key, the n8n encryption key. Mounting
      # that would put every secret one "read this file for me" away from
      # anyone who got hold of the bot token or an allowlisted Telegram
      # account. Workflow JSON has nothing sensitive in it; .env has all of it.
      #
      # :ro means neither the agent nor a bug in it can edit these -- the
      # files on disk stay the single source of truth.
      - ./n8n/workflows:/workspace/n8n-workflows:ro
      - ./transcripts:/transcripts
      - ./scripts:/scripts:ro      # so export.cmd can run without Python on Windows
      # WRITABLE, unlike everywhere else, because places.cmd runs the importer
      # in here. It only ever writes config/places.local.yaml; the curated
      # config/places.yaml is never opened for writing by anything.
      - ./config:/config
      - hermes_state:/state
      # PER-PERSON MEMORY. One directory per SSO identity, markdown inside.
      # The path is all that decides where memory lives, which is why it is
      # a named volume rather than a bind: switching it to the NAS is one
      # definition at the bottom of this file, not a change here.
      - hermes_memory:/memory
      # WHO EXISTS. The same people.json the Rust auth service reads and the
      # admin panel writes -- read-only here, because Hermes must never be
      # able to grant anybody an account or change a password hash. It reads
      # it for one thing: the email of the person talking, and their name.
      - ./site-data/auth:/identity:ro
      # Proton Pass CLI: binary + session data, read-only. Keys are fetched
      # at runtime via pass-cli -- nothing lives in .env. (2026-10-28)
      # Mounting the Windows .exe here could never have worked (Linux cannot
      # execute a PE binary) -- fixed 2026-10-28 night to mount a real Linux
      # ELF build instead, copied from the NUC's working ~/.local/bin/pass-cli.
      - D:\secrets-tools\pass-cli-linux-amd64:/usr/local/bin/pass-cli:ro
      # Hermes's OWN session, not the PC's -- the PC's Windows-created session
      # is not readable by this Linux pass-cli binary (confirmed 2026-10-28
      # night: same files, "there is no session" from the Linux build). A
      # dedicated PAT, scoped to just the API keys vault (Viewer only -- the
      # plant tools never write), self-heals its own login in _pass_key().
      - D:\secrets-tools\hermes-worker.token:/secrets/hermes-worker.token:ro
    working_dir: /workspace
    environment:
      - ROUTER_BASE_URL=http://litellm:4000/v1
      - ROUTER_API_KEY=${LITELLM_MASTER_KEY}
      # CASEY'S CAREER NOTES, READ-ONLY (2026-09-03). Her recordings are
      # transcribed and her spoken exchanges kept; zee_notes/zee_growth
      # search them so "what has Casey been working on" is answerable from
      # what she actually said.
      #
      # A DELIBERATE PRIVILEGE. The portal has no login of its own -- it
      # trusts the gate's header -- so Hermes must present an identity to
      # read anything. It is named here rather than inherited, so who
      # Hermes reads AS is a visible decision and can be narrowed to a
      # dedicated account later. The tools are read-only: there is no
      # write path into her portal from here.
      - ZEE_URL=${ZEE_URL:-http://casey:8000}
      - ZEE_AS_EMAIL=${ZEE_AS_EMAIL:-${ADMIN_OWNERS:-}}
      # LuxTTS at 16 steps: expressive-adjacent finish, instant
      - TTS_BASE_URL=http://voice:8091/v1
      # Where /history reads from. Over HTTP rather than by mounting the
      # SQLite file: one writer, no file locking to get wrong, and the
      # recorder can be restarted without touching this container.
      - METRICS_URL=http://metrics:8000
      # --- the house tools (2026-08-31): Hermes' eyes on the stack ----------
      - HOUSE_KUMA_URL=http://192.168.1.86:3001
      - HOUSE_IMMICH_URL=http://192.168.1.86:2283
      - 'HOUSE_IMMICH_KEY=${IMMICH_TAGGER_KEY:-}'
      - HOUSE_PEEWEE_SITE=/house/peewee
      - HOUSE_PENDING=/house/PENDING.md
      # .205 was this PC before its DHCP reservation moved it to .100, so
      # logs_search has been pointing at a dead address. Corrected 2026-09-13
      # while wiring memory in; same stale address as the ollama LAN binding.
      - HOUSE_LOKI_URL=http://192.168.1.100:3100
      - HOUSE_GITEA_URL=http://192.168.1.86:3000
      - 'HOUSE_GITEA_TOKEN=${HOUSE_GITEA_TOKEN:-}'
      - DEFAULT_JOB=${HERMES_DEFAULT_JOB:-chat}
      - HERMES_MEMORY_ROOT=${HERMES_MEMORY_ROOT:-/memory}
      - PEOPLE_FILE=/identity/people.json
      - HERMES_LINKS_FILE=/state/telegram-links.json
      # Pick the model per message automatically. On by default -- choosing
      # a route by hand was busywork. Set AUTO_JOB=false to go manual.
      - AUTO_JOB=${AUTO_JOB:-true}
      - TRANSCRIPT_DIR=/transcripts
      - HERMES_SPEAK=${HERMES_SPEAK:-false}
      - TTS_DEFAULT_VOICE=${HERMES_VOICE:-${VOICE_DEFAULT:-dee}}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      # --- plant lookup tools (2026-10-28): keys pulled from Proton Pass -----
      # No key in .env -- pass-cli reads the vault at runtime.
      - PROTON_PASS_KEY_PROVIDER=fs
      - PROTON_PASS_CLI_DATA_DIR=/state/proton-pass-cli
      - HERMES_PAT_FILE=/secrets/hermes-worker.token
      # The actual plant keys live in the "API keys" vault, not "Keys" --
      # fixed 2026-10-28 night after the tools were found to be broken
      # (pass-cli not yet mounted into the running image, plus this vault
      # mismatch). See also the PlantNet item-title fix in plant_tools.py.
      - PLANT_API_VAULT=API keys
      - PYTHONUNBUFFERED=1
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]

  # ---------------------------------------------------------------------------
  # 6.5 Hermes over HTTP - the same agent, same per-person memory, same tools,
  #     reachable by the phone apps through the auth service.
  #
  #     NO PORTS PUBLISHED, AND THAT IS THE SECURITY MODEL. It trusts
  #     X-Auth-Email, exactly like Gitea, Paperless and Casey's portal do here.
  #     That is only safe while the sole caller is the auth service, which
  #     fills that header from a validated OIDC token. Publish a port and
  #     anyone on the LAN could claim to be anyone -- and since memory is per
  #     person, that would expose everything anybody has ever told Hermes.
