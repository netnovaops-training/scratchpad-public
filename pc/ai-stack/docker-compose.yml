  # ---------------------------------------------------------------------------
  # 7. Telegram bridge - long polling, outbound only. No ports published.
  #    Won't start until you put a token and your user id in .env; that's fine,
  #    the rest of the stack doesn't care.
  # ---------------------------------------------------------------------------
  telegram:
    build:
      context: .
      dockerfile: telegram/Dockerfile
    image: ai-stack/telegram:latest
    container_name: telegram_bridge
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "phone bridge - needs TELEGRAM_* values in .env"
      ai-stack.order: "7"
    depends_on:
      litellm:
        condition: service_healthy
    volumes:
      - ./transcripts:/transcripts
      # Writable now, not :ro -- this is the SAME agent Hermes runs, with the
      # same tools, so it has to be able to edit the same folder. Mutating
      # tools are locked per chat by default; send /unlock to allow them.
      - ./workspace:/workspace
      # The n8n workflow files, read-only, mounted INSIDE /workspace so the
      # agent's existing file tools can read them with no code change --
      # tools.py confines everything to /workspace, and that confinement is
      # doing real work here, so this slips under it rather than widening it.
      #
      # Narrow on purpose. The parent folder (ai-stack) holds .env: the Twilio
      # auth token, the LiteLLM master key, the n8n encryption key. Mounting
      # that would put every secret one "read this file for me" away from
      # anyone who got hold of the bot token or an allowlisted Telegram
      # account. Workflow JSON has nothing sensitive in it; .env has all of it.
      #
      # :ro means neither the agent nor a bug in it can edit these -- the
      # files on disk stay the single source of truth.
      - ./n8n/workflows:/workspace/n8n-workflows:ro
    environment:
      # CAREER MODE (2026-09-06). /career routes this chat to Casey's
      # portal instead of the house agent, so a career question is
      # answered by the thing that has read her awards catalog -- and is
      # KEPT there, reaching the portfolio, the exports and Hermes with
      # no second copy. Map a Telegram id to the address her portal
      # knows her by, or her words have nowhere to be filed:
      #   ZEE_TELEGRAM_USERS=123456789=casey@example.com
      - ZEE_URL=${ZEE_URL:-http://casey:8000}
      - ZEE_TELEGRAM_USERS=${ZEE_TELEGRAM_USERS:-}
      # Validated inside bot.py with a readable error rather than with `:?`
      # here -- otherwise every compose command would fail for people who
      # never set up Telegram.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - WORKSPACE_ROOT=/workspace
      # Start with shell and file writes locked. See bot.py for why.
      - TELEGRAM_TOOLS=${TELEGRAM_TOOLS:-true}
      - TELEGRAM_UNLOCKED=${TELEGRAM_UNLOCKED:-false}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS:-}
      - ROUTER_BASE_URL=http://litellm:4000/v1
      - ROUTER_API_KEY=${LITELLM_MASTER_KEY}
      - TTS_BASE_URL=http://voice:8091/v1
      # /history fetches a PNG from here. See the note in the hermes block.
      - METRICS_URL=http://metrics:8000
      - TTS_DEFAULT_VOICE=${TELEGRAM_VOICE:-${VOICE_DEFAULT:-dee}}
      - DEFAULT_JOB=${TELEGRAM_DEFAULT_JOB:-chat}
      # Pick the model per message automatically. On by default -- choosing
      # a route by hand was busywork. Set AUTO_JOB=false to go manual.
      - AUTO_JOB=${AUTO_JOB:-true}
      - TELEGRAM_VOICE_REPLIES=${TELEGRAM_VOICE_REPLIES:-false}
      - TRANSCRIPT_DIR=/transcripts
      - STT_API_BASE=${STT_API_BASE:-https://api.openai.com/v1}
      - STT_API_KEY=${STT_API_KEY:-}
      - STT_MODEL=${STT_MODEL:-whisper-1}
      - PYTHONUNBUFFERED=1
      # /tickets: lists Mama's open tickets and resolves/closes them by
      # button. Mom lives in docker-compose.web.yml, not here -- reachable
      # by container name regardless, since both files share one network
      # when started together (see docker-compose.web.yml's own top note).
      - MOM_URL=${MOM_URL:-http://mom:8001}
      - MOM_TICKET_API_SECRET_KEY=${MOM_TICKET_API_SECRET_KEY:-}

  # ---------------------------------------------------------------------------
  # 8. Booking: REMOVED 2026-11-12 at Jason's direction ("remove the booking
  #    container and folder"). It had been put down behind a profile since
  #    2026-09-07 and only ever ran in dry-run. Code and this block are archived
  #    in D:\ai-stack-archive\outdated\booking\ . The Koalendar webhook in
  #    web/Caddyfile goes to n8n and is unrelated. Telephony still has
  #    BOOKING_BASE_URL set; with nothing answering, its booking tool reports
  #    that booking is unavailable, exactly as it did while booking was down.
  #    The booking_state volume is kept (not deleted).

  # ---------------------------------------------------------------------------
  # 9. Telephony - the whole phone line, on this machine.
  #
  #    Twilio provides the number and the audio pipe. Everything else is local:
  #    Whisper transcribes, qwen2.5:7b thinks, Kokoro speaks. Audio goes
  #    Twilio -> your house -> Twilio, with no third party in the middle.
  #
  #    This is the ONLY service the tunnel exposes.
  # ---------------------------------------------------------------------------
  telephony:
    build:
      context: .
      dockerfile: telephony/Dockerfile
    image: ai-stack/telephony:latest
    container_name: telephony
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "the phone line - watch these logs during a call"
      ai-stack.order: "9"
    depends_on:
      litellm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8093:8093"     # localhost only; the tunnel reaches it over
                                  # the internal Docker network
    volumes:
      - ./transcripts:/transcripts
      # READ-ONLY. The phone line reads the places directory and the service
      # rules; it has no business writing either.
      - ./config:/config:ro
      # Places added from the browser at /admin/site/places. READ-ONLY: the
      # phone line answers from this, it never writes it - the admin is the only
      # writer, the same split as every other data file in the stack.
      - ./site-data/data:/data/site:ro
      - telephony_state:/state    # callers.db - who has called before
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      # STT MOVED TO THE NUC 2026-08-28. It was never running here: the image
      # ai-stack/stt:latest had never been built, while telephony, voice and
      # booking were built 5-10 days earlier -- so the phone line could speak
      # and take bookings but could not HEAR, for at least ten days.
      #
      # It runs on the NUC now because it does not need a GPU: faster-whisper
      # uses CTranslate2, not torch, and that box has 12 idle cores.
      - STT_BASE_URL=http://192.168.1.86:8092
      - VOICE_BASE_URL=http://voice:8091
      - ROUTER_BASE_URL=http://litellm:4000/v1
      - ROUTER_API_KEY=${LITELLM_MASTER_KEY}
      - PHONE_JOB=${PHONE_JOB:-phone}
      - PHONE_VOICE=${PHONE_VOICE:-dee}
      - BOOKING_BASE_URL=http://booking:8080
      - BOOKING_API_KEY=${BOOKING_API_KEY:-}
      - BUSINESS_NAME=${BUSINESS_NAME:-Tea Miss Dee}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - BOOKING_LINK=${BOOKING_LINK:-}
      - REVIEW_LINK=${REVIEW_LINK:-}
      - TIP_LINK=${TIP_LINK:-}
      - SMS_ENABLED=${SMS_ENABLED:-false}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER:-}
      - BUSINESS_TZ=${BUSINESS_TZ:-America/Los_Angeles}
      - PHONE_SILENCE_MS=${PHONE_SILENCE_MS:-800}
      - PHONE_BARGE_MS=${PHONE_BARGE_MS:-320}
      - TELEPHONY_STATE_DIR=/state
      - TRANSCRIPT_DIR=/transcripts
      - PYTHONUNBUFFERED=1
    healthcheck:
      # 12s, not 3s. This endpoint fans out to stt, voice and booking before it
      # answers -- it took 3.90s with one of them unreachable, which is 0.9s
      # too slow for a 3s probe. The result was 1833 consecutive "unhealthy"
      # reports over 17 hours that said nothing about the actual fault, while
      # the endpoint itself was returning a perfectly clear
      # {"status":"degraded","stt":"unreachable"} to anyone who waited.
      #
      # A probe faster than the thing it probes reports its own impatience.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8093/health',timeout=12).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    profiles: ["phone", "all"]

  # ---------------------------------------------------------------------------
  # 10. Cloudflare Tunnel - how Twilio reaches the telephony service.
  #
  #     This dials OUT to Cloudflare and holds the connection open. Your router
  #     stays closed: no port forwarding, no firewall rule, no static IP, no
  #     certificate to renew. Twilio talks to a Cloudflare hostname; Cloudflare
  #     hands the request down the tunnel to the telephony container.
  #
  #     Only starts when you set CLOUDFLARE_TUNNEL_TOKEN in .env, so the stack
  #     stays fully private until you deliberately open this one door.
  # ---------------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tunnel
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "outbound tunnel so Twilio can reach the phone service"
      ai-stack.order: "10"
    depends_on:
      - telephony
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: ["phone", "all"]
  n8n:
    build:
      context: ./n8n
      dockerfile: Dockerfile
    image: ai-stack/n8n:latest
    container_name: n8n
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "heartbeat + usage graphs - opens at localhost:5678"
      ai-stack.order: "12"
    user: "0:0"    # see n8n/Dockerfile - docker.sock already makes this moot
    depends_on:
      # service_started, NOT service_healthy. n8n does not need litellm to
      # boot -- it only queries it for the models/latency/tokens charts, and
      # those degrade to "no data" by themselves. Requiring health here meant
      # an unhealthy litellm silently took the whole monitoring stack with
      # it, including the tools you'd use to diagnose litellm.
      litellm:
        condition: service_started
    ports:
      - "127.0.0.1:5678:5678"    # loopback only - no public route, ever
    volumes:
      # n8n's own SQLite database (workflows, credentials, execution history)
      # plus its encryption key file. Nothing else needed -- SQLite is a file,
      # not a server, and it's what n8n uses by default. No postgres, matching
      # how the rest of this stack (litellm, the phone line) already avoids
      # standing up a database server it would have to babysit.
      - n8n_data:/home/node/.n8n
      # Read-only, and only so `stats` can read host-metrics.json -- the
      # C: free space, CPU temperature, Windows uptime and internet latency
      # that hostmetrics.ps1 writes from the Windows side. None of those are
      # visible from inside a container. A plain file drop, not a new port.
      - ./transcripts:/transcripts:ro
      # What the user chose over the read-only sidecar: n8n sees the Docker
      # API directly. This is root-equivalent on this PC -- anyone who can
      # edit a workflow here, or any bug in a community node, can ask the
      # Docker daemon to start a container with any mount it wants. That is
      # the deliberate tradeoff for a Docker node that works like Docker
      # actually works, instead of a narrower read-only JSON endpoint.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GENERIC_TIMEZONE=${BUSINESS_TZ:-America/Los_Angeles}
      - TZ=${BUSINESS_TZ:-America/Los_Angeles}
      # Loopback-only and no TLS in front of it, so n8n's session cookie has to
      # be told not to require https. If this ever moves behind Caddy, this
      # flips back to the default (true) or the login redirect loops forever.
      - N8N_SECURE_COOKIE=false
      # Keeps the actual bot token and allowlist OUT of the workflow JSON files
      # this build hands you -- workflows read $env.TELEGRAM_BOT_TOKEN instead
      # of having the value pasted into them. Off by default in recent n8n for
      # good reason (a compromised workflow could read anything in the
      # process's environment); on here because that's exactly what these
      # workflows are meant to do, deliberately and narrowly.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # n8n 2.0 DISABLED the Execute Command node by default. Without this
      # line every workflow here fails with "Unrecognized node type:
      # n8n-nodes-base.executeCommand" -- not on import, but at RUN time,
      # which is why it looked like it imported fine and then broke.
      #
      # An empty list means "exclude nothing", i.e. put Execute Command back.
      # n8n's own docs give exactly this value for exactly this purpose:
      # https://docs.n8n.io/changelog/v20-breaking-changes
      #
      # Their reason for disabling it is that it runs arbitrary commands in
      # the container. That is precisely what the stats/graph workflows do --
      # they shell out to `docker`. On this box that horse left the barn the
      # moment docker.sock was mounted above: the container is already
      # root-equivalent on this PC by design and by your explicit choice.
      # This line doesn't widen that; it just stops n8n hiding the node that
      # makes the tradeoff useful.
      - 'NODES_EXCLUDE=[]'
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS:-}
      # Encryption key for n8n's stored credentials. Generated once by
      # env-sync.cmd and kept STABLE, same reasoning as ZEE_SECRET_KEY and the
      # rest: if this ever changed, every saved credential in n8n would become
      # unreadable garbage on the next restart.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?run env-sync.cmd - it generates one}
      # ===== THE BUG THAT LOST YOUR WORKFLOWS =====================
      # n8n puts its database in  $HOME/.n8n , not in a fixed path. This
      # container runs as root (user: "0:0", needed for the Docker socket),
      # and root's HOME is /root -- so n8n was writing everything to
      # /root/.n8n while the volume was mounted at /home/node/.n8n.
      #
      # The volume was therefore empty and ignored, and the real database
      # lived in the container's own filesystem, which is destroyed every
      # time the container is recreated. `update.cmd` recreates n8n. That is
      # why the login, the workflows and the encryption key "never took".
      #
      # This line pins the folder explicitly, so it no longer depends on
      # which user the container runs as.
      - N8N_USER_FOLDER=/home/node
      # Exposes /metrics for Netdata to scrape: workflow executions, failures,
      # queue depth. Cheap, local-only, and it turns "did the heartbeat run?"
      # into a chart instead of a scroll through the Executions tab.
      - N8N_METRICS=true
      # Requested explicitly: don't keep a row for every successful run
      # forever. Errors are still kept (worth seeing why a heartbeat failed);
      # only the routine noise of "ran fine, every 5 minutes" is skipped.
      # 'none' keeps the database small, which is why it was set -- but it
      # also means a successful run leaves NO trace, so the Overview page
      # reads 0 executions forever and you cannot tell "working" from "never
      # ran". Set N8N_SAVE_SUCCESS=all in .env while you are getting things
      # working, then put it back to none once you trust it.
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=${N8N_SAVE_SUCCESS:-none}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      # info, not warn. n8n reports things like "settings file permissions
      # are too wide" and "could not write to the database" at INFO -- at warn
      # they are invisible, which is exactly the situation where the container
      # looks fine and silently loses your data. Turn this back to warn once
      # persistence is confirmed working, if the noise bothers you.
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      # n8n 2.0 requires its settings file to be 0600 and REFUSES it otherwise.
      # This container runs as root (needed for the Docker socket), and root
      # creates that file 0644 by default -- too wide. Setting this makes n8n
      # fix the permissions itself instead of rejecting the file, which is a
      # prime suspect for "everything resets on refresh".
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true


  # --- netdata: REMOVED 2026-08-31 at Jason's word. The one wall
  # (Homepage) + Kuma + Grafana cover what it showed; its config/lib/
  # cache volumes were deleted with it. ---

  metrics:
    build:
      context: .
      dockerfile: metrics/Dockerfile
    image: ai-stack/metrics:latest
    container_name: metrics
    # LAN-published for the NUC's one POST (shared secret). The router
    # forwards only 80/443, so this port never faces the internet.
    ports:
      - "8033:8000"
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "records history every 2 min - /history in Hermes and Telegram"
      ai-stack.order: "14"
    volumes:
      - metrics_data:/data
      # READ-ONLY, and only ever GET /containers/json. Netdata reports how
      # MANY containers are stopped but never WHICH, and "telephony was down
      # from 2am to 6am" is the single most useful thing in the history --
      # that name has to come from somewhere.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The Windows numbers Docker genuinely cannot see: C: free space, real
      # NIC throughput, internet latency, and the CPU/RAM of the PC rather
      # than of the Linux VM Docker runs inside it.
      - ./transcripts:/host-metrics:ro
    environment:
      # netdata retired 2026-08-31; empty disables that collector cleanly
      - NETDATA_URL=
      - METRICS_DB=/data/history.db
      - METRICS_INTERVAL_SECONDS=${METRICS_INTERVAL_SECONDS:-120}
      # One month. Raise it if you want a longer memory; the cost is linear
      # and small (roughly 3 MB per month).
      - METRICS_RETAIN_DAYS=${METRICS_RETAIN_DAYS:-30}
      - COMPOSE_PROJECT=ai-stack
      # The 8pm report asks LiteLLM for model usage directly.
      - LITELLM_BASE=http://litellm:4000
      - ROUTER_API_KEY=${LITELLM_MASTER_KEY}
      # Written by printserver.ps1 into transcripts\, which is mounted here
      # read-only as /host-metrics.
      - PRINTER_STATUS=/host-metrics/printer-status.json
      - ENGINE_INGEST_KEY=${ENGINE_INGEST_KEY:-}
      - NUC_METRICS=/data/nuc-metrics.json
      # Same timezone as n8n, so "today" in the report means the same day the
      # 8pm trigger thinks it is. Two services disagreeing about midnight is
      # the kind of bug you only notice at 11pm on the 1st of a month.
      - TZ=${BUSINESS_TZ:-America/Los_Angeles}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s


  # ---------------------------------------------------------------------------
  # 15. cups + printq - printing, without Windows in the way
  #
  #  WHY THIS REPLACED THE POWERSHELL PRINT SERVER
  #  The Windows path accepted a job, moved the file to printed\, reported
  #  success, and produced no paper. Windows had marked the printer Offline
  #  because its WSD port stopped answering, and WSD does not recover when the
  #  printer wakes up. Nothing in that chain would say so.
  #
  #  This path never touches Windows: printq -> CUPS -> IPP -> printer. No
  #  spooler, no WSD, no "Use Printer Offline" checkbox, no scheduled task and
  #  no console window popping up every minute. When it fails, CUPS says why.
  #
  #  YOU MUST SET PRINTER_IP in .env. CUPS normally finds printers with
  #  mDNS/Bonjour, and multicast does NOT cross Docker Desktop's NAT -- a
  #  container will never discover a printer on your LAN however long it
  #  looks. Naming the address is the only thing that works, and it is more
  #  stable anyway. Reserve it in your router so it cannot move.
  #    Find it on the printer: Menu > Network > WLAN > TCP/IP > IP Address
  # ---------------------------------------------------------------------------
  cups:
    image: olbat/cupsd:latest
    container_name: cups
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "print server - http://localhost:631 (no login needed)"
      ai-stack.order: "15"
    ports:
      # Localhost only, like everything else. The web UI is genuinely useful
      # for adding a second printer or reading a failed job's real error.
      - "127.0.0.1:631:631"
    volumes:
      - cups_config:/etc/cups
      # WHY THIS FILE IS MOUNTED
      # The image ships a cupsd.conf that demands a username and password
      # before it will accept a print job from another machine. The CUPS
      # command-line tools read that password from a CONSOLE -- and a
      # container has none, so `lp` sat there printing "Password for root on
      # cups?" forever and the job never left printq. Every print we tried
      # died there. Read cups/cupsd.conf itself; the header explains exactly
      # what is traded away and why it is safe here.
      #
      # Mounted :ro deliberately. cupsd rewrites this file if you press
      # "Change Settings" in the web UI, which would silently throw away the
      # comments and the fix. Read-only means that button fails loudly
      # instead. cupsd only READS the file at startup, so :ro cannot stop the
      # container booting.
      - ./cups/cupsd.conf:/etc/cups/cupsd.conf:ro
    environment:
      - TZ=${BUSINESS_TZ:-America/Los_Angeles}
    healthcheck:
      test: ["CMD-SHELL", "lpstat -r >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  printq:
    build:
      context: .
      dockerfile: printq/Dockerfile
    image: ai-stack/printq:latest
    container_name: printq
    restart: unless-stopped
    logging: *default-logging
    labels:
      ai-stack.role: "prints what you approve in Telegram; watches the page counter"
      ai-stack.order: "15b"
    depends_on:
      cups:
        condition: service_started
    volumes:
      # Writable: this is the half that moves files out of approved/ into
      # printed/ or failed/, and writes printer-status.json.
      - ./transcripts:/transcripts
    environment:
      - CUPS_HOST=cups:631
      - PRINTER_NAME=${PRINTER_NAME:-brother}
      # REQUIRED. Without it printq can start but cannot add the printer, and
      # says so in /print rather than failing silently.
      - PRINTER_IP=${PRINTER_IP:-}
      - PRINT_QUEUE=/transcripts/print-queue
      - PRINTER_STATUS=/transcripts/printer-status.json
      - PRINT_POLL_SECONDS=${PRINT_POLL_SECONDS:-15}
      # Read-only SNMP, for the lifetime page counter. Brother ships
      # with v2c enabled and community "public"; change only if you
      # locked yours down.
      - SNMP_COMMUNITY=${SNMP_COMMUNITY:-public}
      - TZ=${BUSINESS_TZ:-America/Los_Angeles}


# --- imagine service: REMOVED 2026-08-31 at Jason's direction (container,
# image and model volume deleted). ---

volumes:
  # WHERE HERMES REMEMBERS PEOPLE.
  #
  # Local by default so the feature works today. Jason wants it on the NAS,
  # in each person's own home directory, so the NAS enforces the boundary as
  # well as Hermes does and a person can open their own memory in File
  # Station. That needs ONE change in DSM which nothing here can do:
  #
  #   Control Panel -> Shared Folder -> homes -> Edit -> Permissions
  #   -> give `homelab` Read/Write
  #
  # Measured 2026-09-13: `homelab` has full read/write on photo, Pictures,
  # private, Paperless and videos, and is DENIED on homes, home and Music.
  # There is no NFS route either -- homes is not in the export list.
  #
  # `private` was considered as an interim and REJECTED: it is an encrypted
  # share, so after any NAS reboot it stays locked, the mount fails, and
  # memory would silently vanish until somebody unlocked it by hand.
  #
  # Once the grant exists, comment out the local line and uncomment the cifs
  # block. Nothing else changes -- the code takes the root as a path.
  hermes_memory:
  # hermes_memory:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     device: "//192.168.1.68/homes"
  #     o: "username=homelab,password=${NAS_HOMELAB_PASSWORD},vers=3.0,uid=1000,gid=1000,file_mode=0660,dir_mode=0770,noserverino"
  tagger_data:
  cups_config:
  litellm_db:
  metrics_data:
  ollama_data:
  open_webui_data:
  hermes_state:
  hf_cache:
  n8n_data:
  booking_state:
  telephony_state:
  voicebox_data:
