# The filebrowser service block, kept as a valid compose file of its own (the CI compose check
# rejected the bare block: "additional properties 'filebrowser' not allowed"). The live copy is in
# ../docker-compose.yml; paste only the indented service below `services:` when changing it.
# Wrapped 2026-11-19; checked with `docker compose -f files/compose-block.yml config -q`.
services:
  # ---------------------------------------------------------------------------
  #  filebrowser -- the way things get ONTO the shelves.
  #
  #  Jason, 2026-09-11: "i have mango for casey its in cbz format I want to
  #  upload this any more how do I".
  #
  #  THE GAP THIS FILLS. Everything built so far moves documents ALONG the
  #  pipeline -- mail in, Paperless tags, the router copies out to Kavita.
  #  But the front door was scp. That is fine for Jason and useless for
  #  everybody else, and "everybody else" is the entire point of a household
  #  stack. Casey is not going to scp a comic.
  #
  #  WHY NOT PAPERLESS FOR THIS. Paperless is the intake for DOCUMENTS: it
  #  OCRs, it extracts text, it classifies. A .cbz is a zip of JPEGs. There
  #  is no text to find, nothing to classify, and OCR on four hundred manga
  #  pages would burn an hour of CPU to produce noise. Comics go straight to
  #  Kavita, which already has the library (id=3, type 0 Manga, watching
  #  /manga/casey). The routing table in paperless_dest.py is for things with
  #  words in them.
  #
  #  PROXY AUTH, NOT A SECOND PASSWORD. --auth.method=proxy makes
  #  FileBrowser trust the X-Auth-Email header Caddy sets after the
  #  household gate has already verified who this is. So there is no second
  #  login and no second password to forget, and the person FileBrowser
  #  thinks you are is the person the household SSO says you are.
  #
  #  WHICH MEANS THIS MUST NEVER BE REACHABLE EXCEPT THROUGH CADDY.
  #  An app that trusts an identity header will believe ANYONE who sets that
  #  header. Reaching this container directly on the LAN and sending
  #  "X-Auth-Email: user@example.com" would make you Jason. Hence the bind to
  #  192.168.1.86 rather than 0.0.0.0, and hence the fact that the only
  #  route in from outside is the Caddy site block, which strips any
  #  inbound X-Auth-Email before setting its own. This is the same
  #  header-trust pattern Gitea and Paperless use here, and the same caveat
  #  applies to all three.
  #
  #  SCOPES ARE WHAT KEEP PEOPLE APART. Each FileBrowser user gets a scope
  #  -- a subtree they cannot climb out of. Casey's is /srv/manga/casey, so she
  #  can add comics and cannot see Sachin's shelf or Jason's tax returns.
  #  Set them with files-users.sh after the container is up; a user with no
  #  entry gets no access at all rather than the root.
  # ---------------------------------------------------------------------------
  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    ports:
      # LAN ONLY. See the header-trust note above -- this is not optional.
      - "192.168.1.86:8099:80"
    volumes:
      - filebrowser_data:/database
      - ./files/settings.json:/config/settings.json:ro
      # The trees people are allowed to put things into. Mounted at the
      # same shapes Kavita sees them, so a file dropped here is a file
      # Kavita finds -- no copy step, no sync lag, no second source of
      # truth about where a book lives.
      - /home/user/manga:/srv/manga
      - /home/user/documents:/srv/books
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  filebrowser_data:
