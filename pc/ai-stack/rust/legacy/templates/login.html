<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>{{ title }}</title>
<style>
:root{--bg:#0d0a12;--ink:#f2ecf0;--muted:#a08fa0;--line:rgba(217,138,176,.22);--accent:#d98ab0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
     font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
.card{width:100%;max-width:360px;border:1px solid var(--line);border-radius:16px;padding:30px;
      background:rgba(255,255,255,.025);text-align:center}
h1{margin:0 0 6px;font-size:1.2rem;font-weight:600}
p.sub{margin:0 0 24px;color:var(--muted);font-size:.86rem}
label{display:block;text-align:left;font-size:.78rem;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
      background:#160f1a;color:var(--ink);font-size:1rem}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;margin-top:16px;padding:12px;border-radius:10px;border:0;background:var(--accent);
       color:#1a0d14;font-weight:600;font-size:1rem;cursor:pointer}
button:hover{filter:brightness(1.07)}
.err{margin:0 0 16px;padding:10px 12px;border-radius:9px;background:rgba(232,105,90,.12);
     border:1px solid rgba(232,105,90,.4);color:#ffd9d3;font-size:.84rem}
footer{margin-top:22px;color:var(--muted);font-size:.72rem}
</style>
</head>
<body>
<form class="card" method="post" action="login">
  <h1>{{ title }}</h1>
  <p class="sub">These are private. Ask Jason for the password.</p>
  {% if !error.is_empty() %}<p class="err">{{ error }}</p>{% endif %}
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
  <button type="submit">Come in</button>
  <footer>&copy; {{ year }}</footer>
</form>
</body>
</html>
