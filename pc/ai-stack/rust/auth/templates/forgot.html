<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a12">
<meta name="robots" content="noindex, nofollow">
<title>Reset your password</title>
<link rel="stylesheet" href="/theme.css">
<style>.card-form{width:min(380px,100%)}</style>
</head>
<body>
<div class="centre">
  <form class="panel card-form" method="post" action="forgot">
    <h1>Reset your password</h1>
    {% if !error.is_empty() %}<p class="note bad">{{ error }}</p>{% endif %}
    <p class="muted">Enter your email and we'll send you a code.</p>

    <label for="e">Your email</label>
    <input id="e" name="email" type="email" autocomplete="username"
           value="{{ email }}" required autofocus>

    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Send me a code</button>

    <p class="muted" style="margin-top:1rem">
      <a href="./?next={{ next_q }}">Back to sign in</a>
    </p>
  </form>
</div>
</body>
</html>
