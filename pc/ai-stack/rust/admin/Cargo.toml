[package]
name = "admin"
version = "0.1.0"
edition = "2021"

# Keep this name in sync with ARG APP in rust/Dockerfile and with the
# `build.args.APP` in docker-compose.web.yml.
[[bin]]
name = "admin"
path = "src/main.rs"

[dependencies]
common.workspace = true
# "multipart" is what makes file upload work. axum does not include it by
# default, and without it the upload handler will not compile.
axum = { workspace = true, features = ["multipart"] }
tokio.workspace = true
tower-http.workspace = true
askama.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true
time.workspace = true
argon2.workspace = true
rand.workspace = true
# Signs the session cookie, so a session survives a restart without this
# container holding any state on disk. See "The signed session cookie" in
# src/main.rs. Same two crates the auth service uses for the same job.
hmac.workspace = true
sha2.workspace = true
# Talks to Kitchen, kb, Ollama and imagine over the internal Docker network
# for the picture backlog page. Already a workspace dependency elsewhere.
reqwest.workspace = true
