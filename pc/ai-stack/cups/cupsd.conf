# =============================================================================
#  CUPS configuration for the ai-stack print server.
#
#  WHY THIS FILE EXISTS
#  Out of the box, cupsd demands a username and password before it will accept
#  a print job or let a printer be added from anywhere except the machine it
#  runs on. That is the right default for a print server on an office LAN.
#
#  It is unworkable here for one specific reason: the CUPS command-line tools
#  read passwords from a CONSOLE. A container has no console, so there is
#  literally nothing to type into. `lp` from another container prompts
#  "Password for root on cups?" forever and the job never leaves. That is
#  exactly what was happening -- every print was failing at authentication,
#  which looked like the printer silently discarding jobs.
#
#  WHAT THIS TRADES AWAY, HONESTLY
#  It turns off authentication for printing and printer administration. Anyone
#  who can reach port 631 can print, add a printer, or delete one.
#
#  Who can reach port 631:
#    * the other containers in this stack (private Docker network)
#    * you, on this PC, at http://localhost:631
#
#  and nobody else, because docker-compose.yml publishes it as
#  "127.0.0.1:631:631" -- bound to loopback, not to your network and certainly
#  not to the internet. The exposure this adds is "another container in your
#  own stack could print something", which is the same trust level those
#  containers already have.
#
#  If you ever publish 631 beyond loopback, revisit this file FIRST.
# =============================================================================

LogLevel warn
MaxLogSize 0

# Only inside Docker. The host publishes this on 127.0.0.1 only.
Listen 0.0.0.0:631

# WHY ServerName IS SET, AND WHY IT MATTERS MORE THAN IT LOOKS
# cupsd checks the HTTP "Host:" header on every request and answers 400 Bad
# Request unless it matches ServerName, an alias below, or "localhost". That
# check exists to stop DNS rebinding: a hostile web page in your browser can
# point its own domain at 127.0.0.1 and POST to port 631, and the Host check
# is what refuses it.
#
# The catch is that the default ServerName is the container's hostname, which
# Docker sets to a random ID. printq reaches CUPS as "cups:631", which matched
# nothing, so every single lpadmin and lp came back "Bad Request" -- and lp
# reports that as "The printer or class does not exist", which sent us looking
# for a missing queue that was there the whole time.
#
# Naming the server "cups" fixes it without weakening anything. Do NOT replace
# this with `ServerAlias *`, which is the advice you will find everywhere: it
# turns the rebinding check off completely, and your browser can reach this
# server on localhost:631.
ServerName cups
ServerAlias localhost 127.0.0.1

# No mDNS/Bonjour. Multicast does not cross Docker Desktop's NAT, so browsing
# finds nothing and only adds noise to the log. Printers are added by IP.
Browsing Off
BrowseLocalProtocols none

# The web interface, at http://localhost:631. Genuinely useful for reading a
# failed job's real error message.
WebInterface Yes

# THE KEY LINE. Without it every operation below still demands a password no
# matter how permissive the Limit blocks are.
DefaultAuthType None

# Keep completed jobs so "what did we print" is answerable, and so a failed
# job's error is still readable afterwards.
PreserveJobHistory Yes
PreserveJobFiles No
MaxJobs 500

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow all
</Location>

<Location /admin/log>
  Order allow,deny
  Allow all
</Location>

# `Order deny,allow` means "allow unless explicitly denied" -- and nothing
# here denies. Combined with DefaultAuthType None, that is what removes the
# password prompt.
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Cancel-Job Cancel-My-Jobs Close-Job Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job CUPS-Move-Job CUPS-Get-Document>
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
