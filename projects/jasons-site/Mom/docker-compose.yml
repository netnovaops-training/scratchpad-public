# Tech Help — Raspberry Pi 5 deployment.
#
#   cp .env.example .env    # then edit it
#   docker compose up -d --build
#   docker compose logs -f
#
# The app binds to 127.0.0.1 only. Caddy on the host terminates TLS and proxies
# to it, so the container is never directly reachable from the network.
services:
  momhelp:
    build:
      context: .
      dockerfile: Dockerfile
    image: momhelp:latest
    container_name: momhelp
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - momhelp-data:/data
      # Live-edit the AI's rules without rebuilding. Changes apply to the next
      # question asked — no restart needed.
      - ./knowledge:/app/knowledge:ro
    # The GPU box is outside Docker, so the container needs ordinary LAN egress.
    # No extra network config required, but this documents the dependency.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  momhelp-data:
