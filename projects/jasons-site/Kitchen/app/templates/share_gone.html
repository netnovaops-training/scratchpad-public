<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e58325">
<title>Link expired</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>&#127859;</text></svg>">
<style>
:root{--bg:#f2f2f2;--panel:#fff;--ink:#1b1b1b;--muted:#68696b;--line:#e0e0e0}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--panel:#1e1e1e;--ink:#eaeaea;--muted:#a3a3a3;--line:#2e2e2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;
 align-items:center;justify-content:center;
 font:16px/1.6 "Roboto",ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
 padding:1.6rem;max-width:22rem;margin:1rem;text-align:center}
h1{font-size:1.2rem;margin:0 0 .6rem}
p{color:var(--muted);margin:0;font-size:.92rem}
</style>
</head>
<body>
<div class="card">
  <h1>This link isn't working any more</h1>
  <p>Share links only last a couple of days, and this one has either expired
    or was never valid. Ask whoever sent it for a new one.</p>
</div>
</body>
</html>
