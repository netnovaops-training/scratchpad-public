{% extends "base.html" %}
{% block title %}Not that one{% endblock %}
{% block sub %}<p class="small muted">&nbsp;</p>{% endblock %}

{% block body %}

<div class="card">
  <!-- white-space:pre-line, because these messages are written to be read.
       core.Blocked and LLMError both put a real sentence in here explaining
       what to do next, sometimes across two paragraphs. Collapsing the
       newlines would run them together. -->
  <p style="white-space:pre-line;margin:0">{{ message }}</p>
</div>

<p style="text-align:center">
  <a class="btn ghost" href="{{ root }}/">Try another link</a>
</p>

{% endblock %}
